repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # frozen: v0.10.0.1
    hooks:
      - id: shellcheck
        # Follow sourced files (the first-boot hooks source the base role's
        # secrets.sh), as tests/ansible/lint.sh does with --external-sources,
        # so a commit that stages a hook without its library still passes.
        args: [--external-sources]
  - repo: local
    hooks:
      - id: packer-fmt
        name: packer fmt -check
        entry: packer fmt -check -recursive packer/
        language: system
        pass_filenames: false
        files: \.pkr\.hcl$|\.pkrvars\.hcl$
      - id: kickstart-lint
        name: kickstart lint
        entry: tests/kickstart/ks-lint.sh
        language: system
        pass_filenames: false
        files: ks\.cfg\.pkrtpl\.hcl$|ks-lint\.sh$
