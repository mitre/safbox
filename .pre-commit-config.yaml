repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: packer-fmt
        name: packer fmt -check
        entry: packer fmt -check -recursive packer/
        language: system
        pass_filenames: false
        files: \.pkr\.hcl$|\.pkrvars\.hcl$
      - id: kickstart-lint
        name: kickstart lint
        entry: tests/kickstart/ks-lint.sh
        language: system
        pass_filenames: false
        files: ks\.cfg\.pkrtpl\.hcl$|ks-lint\.sh$
