---
# One first-boot step (firstboot_step): the role vars.yml names for it, or
# else the hook of that name in firstboot.d. A failure stops the play with
# the step's and the task's names. The rescue sees the failed task's result
# uncensored even when the task is no_log, so for such a task it prints
# neither the message nor the error output, which may hold the secret
# (tests/ansible/firstboot-step.sh).
- name: "Step {{ firstboot_step }}"
  block:
    - name: "Run the role of step {{ firstboot_step }}"
      when: firstboot_step in firstboot_role_by_step
      ansible.builtin.include_role:
        name: "{{ firstboot_role_by_step[firstboot_step] }}"

    - name: "Run the hook {{ firstboot_step }}"
      when: firstboot_step not in firstboot_role_by_step
      ansible.builtin.command:
        cmd: "{{ firstboot_hook_dir }}/{{ firstboot_step }}"
      register: firstboot_hook_run
      changed_when: true

    - name: "Show what this hook printed: {{ firstboot_step }}"
      when:
        - firstboot_step not in firstboot_role_by_step
        - (firstboot_hook_run.stdout_lines + firstboot_hook_run.stderr_lines) | length > 0
      ansible.builtin.debug:
        msg: "{{ firstboot_hook_run.stdout_lines + firstboot_hook_run.stderr_lines }}"

  rescue:
    - name: "Stop first boot at the failed step {{ firstboot_step }}"
      ansible.builtin.fail:
        msg: >-
          first-boot step {{ firstboot_step }} failed at '{{ ansible_failed_task.name }}':
          {{ '(details withheld: the task is no_log)' if firstboot_failed_no_log | bool
             else (ansible_failed_result.msg | default('')) ~ ' ' ~ (ansible_failed_result.stderr | default('')) }};
          no marker is written, so first boot runs again at the next boot
      vars:
        firstboot_failed_no_log: >-
          {{ ansible_failed_task.no_log | default(false)
             or ansible_failed_result.censored is defined }}
