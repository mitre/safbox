---
# Where each family keeps local trust anchors, how it rebuilds the store and
# the PEM bundle the rebuild writes, which every client on the box reads.
# The anchor is not named safbox-*: the site_config role owns those anchors
# and removes any it was not configured with. Debian's
# update-ca-certificates reads only *.crt.
proxy_tls_trust:
  RedHat:
    anchors: /etc/pki/ca-trust/source/anchors
    rebuild: [update-ca-trust, extract]
    bundle: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  Debian:
    anchors: /usr/local/share/ca-certificates
    rebuild: [update-ca-certificates]
    bundle: /etc/ssl/certs/ca-certificates.crt
proxy_tls_anchor: "{{ proxy_tls_trust[ansible_facts['os_family']].anchors }}/local-ca-safbox-proxy.crt"
proxy_tls_bundle: "{{ proxy_tls_trust[ansible_facts['os_family']].bundle }}"
