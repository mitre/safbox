---
# proxy_tls role of the first-boot play (services role, task group
# safbox-services-3). Options are described in meta/argument_specs.yml.
proxy_tls_days: 365
proxy_tls_ca_days: 3650
proxy_tls_etc_dir: /etc/safbox
proxy_tls_dir: "{{ proxy_tls_etc_dir }}/tls"
proxy_tls_ca_dir: "{{ proxy_tls_etc_dir }}/ca"
proxy_tls_key: "{{ proxy_tls_dir }}/safbox.key"
proxy_tls_cert: "{{ proxy_tls_dir }}/safbox.crt"
proxy_tls_ca_key: "{{ proxy_tls_ca_dir }}/ca.key"
proxy_tls_ca_cert: "{{ proxy_tls_ca_dir }}/ca.crt"
proxy_tls_names_file: "{{ proxy_tls_etc_dir }}/proxy-names"
