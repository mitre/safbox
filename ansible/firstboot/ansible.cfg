# ansible-core settings for the first-boot play (ANSIBLE_CONFIG in
# safbox-firstboot.service). It runs on the box itself, with no network
# assumed: localhost only, and the collections the tools role installed
# system-wide.
[defaults]
interpreter_python = /usr/bin/python3
collections_path = /usr/share/ansible/collections
roles_path = /usr/local/lib/safbox/firstboot/roles
# Modules would log each invocation, arguments included, to syslog and so
# the journal; the play's own output already goes there through the unit.
no_target_syslog = True
# Temporary files in the unit's runtime directory, not in /root.
local_tmp = /run/safbox-firstboot/ansible
remote_tmp = /run/safbox-firstboot/ansible
retry_files_enabled = False
nocolor = True
# Each task's time in the journal.
callbacks_enabled = ansible.posix.profile_tasks
