# Placeholder inventory. The Packer ansible provisioner supplies the real
# target; tests/ansible/idempotence.sh builds one from SAFBOX_HOST.
# Replace the address to run the playbook by hand against a booted VM:
#   ansible-playbook -i inventory/example.ini playbooks/safbox.yml
# ansible_user=packer fits a VM mid-build only; the seal step deletes that
# account, so against a deployed SAFBox use the user cloud-init created.
[safbox]
safbox-build ansible_host=192.0.2.10 ansible_user=packer

[safbox:vars]
ansible_python_interpreter=/usr/bin/python3
