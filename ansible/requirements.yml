---
# Roles and collections the build runner needs for the appliance layer,
# pinned to exact versions so every build installs the same code.
# Install both from the ansible/ directory:
#   ansible-galaxy install -r requirements.yml
# Roles land in galaxy_roles/ (the first roles_path in ansible.cfg,
# git-ignored); the build does the same through Packer's galaxy_file.

# The Ansible Lockdown RHEL 10 STIG role the template_hardening role applies. Pinned
# by the commit its release tag names, so a moved tag cannot change it; the
# release, commit and STIG release are recorded in group_vars
# (safbox_hardening_lockdown); keep the two the same.
roles:
  - name: RHEL10-STIG
    src: https://github.com/ansible-lockdown/RHEL10-STIG.git
    scm: git
    version: b45366ba7e3820afa2b92c4511ec4bb58f6e9359

# The releases bundled with the ansible 14.5.0 community package, each
# installed from its source repository at the commit its release tag names
# (the release is in the comment), so a moved tag cannot change it.
# ansible.posix and community.general are the collections the Lockdown role
# declares (its collections/requirements.yml); community.crypto is the one
# the first-boot play's certificate tasks use, so its syntax check resolves;
# community.library_inventory_filtering_v1 is community.general's own
# dependency, listed so it is pinned too.
collections:
  - name: https://github.com/ansible-collections/ansible.posix.git
    type: git
    version: e98d9a0756458be1ac710988498000973889075c  # 2.2.2
  - name: https://github.com/ansible-collections/community.crypto.git
    type: git
    version: fce4f220c3b54d5c6eb9c94ef74fc25ae3f5fb91  # 3.5.0
  - name: https://github.com/ansible-collections/community.general.git
    type: git
    version: bbe4fa1a88a60db1000e18982849b4c54fa84fe0  # 13.5.0
  - name: https://github.com/ansible-collections/community.library_inventory_filtering.git
    type: git
    version: 5f70dd8678885157cb186e8b64382a30cab3e12f  # 1.1.5
  - name: https://github.com/containers/ansible-podman-collections.git
    type: git
    version: 1a9e62dde6e631adbbb604583187f088dc0d6e7d  # 1.21.0
