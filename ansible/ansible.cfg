# Ansible configuration for the SAFBox appliance layer.
# Used when ansible-playbook runs with this directory as the working
# directory or with ANSIBLE_CONFIG pointing here.

[defaults]
inventory = inventory/example.ini
# galaxy_roles/ (git-ignored) first, so ansible-galaxy installs the pinned
# third-party roles from requirements.yml there; the project's own roles
# live in roles/.
roles_path = galaxy_roles:roles
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections
# Fact caching is off: every run gathers fresh facts from the target.
gathering = implicit
fact_caching = memory
# Build targets are freshly installed VMs whose host keys are not known in
# advance. Set ANSIBLE_HOST_KEY_CHECKING=True in the environment to override
# when running against a long-lived host.
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
forks = 5
stdout_callback = ansible.builtin.default
deprecation_warnings = True

[privilege_escalation]
become_method = ansible.builtin.sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
