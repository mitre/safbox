---
# One privileged command: deleting the build user's sudo drop-in ends sudo
# for the session running this play, and deleting the user ends its logins,
# so everything that needs root happens here. (The running sshd keeps the
# deleted host keys in memory until it restarts; a clone generates new ones
# on first boot.) The script ends by
# asserting its own post-conditions and exits non-zero if the seal is
# incomplete, which fails the build.
- name: Remove host keys and the build user, truncate logs, verify the seal
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: "{{ lookup('ansible.builtin.template', 'finalize.sh.j2') }}"
  register: template_seal_finalize
  changed_when: true
