---
# Golden-image reset by cloud-init itself: instance state, logs, seed,
# machine-id (set to "uninitialized" so systemd generates a new one on the
# clone's first boot) and the network configuration it generated.
- name: Reset cloud-init and the machine identity so a clone runs as a new instance
  ansible.builtin.command:
    argv: [cloud-init, clean, --logs, --seed, --machine-id, --configs, network]
  changed_when: true

- name: Remove files cloud-init wrote for the build VM's own instance
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ template_seal_cloud_init_instance_files }}"

- name: Find first-boot env files that must not exist in a template
  ansible.builtin.find:
    paths: "{{ template_seal_env_file_dir }}"
    patterns: "{{ template_seal_env_file_pattern }}"
    file_type: file
  register: template_seal_env_files

- name: Remove first-boot state, the build's service status, env files and TLS material
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ template_seal_firstboot_state + template_seal_build_status_files
       + (template_seal_env_files.files | map(attribute='path') | list) + template_seal_tls_paths }}
  register: template_seal_removed

# The services' secrets are podman secrets each clone's first boot makes
# (the first-boot play's clone_secrets role); a template holds none. Skipped on a
# build without the container runtime.
- name: Look for podman
  ansible.builtin.stat:
    path: "{{ template_seal_podman }}"
  register: template_seal_podman_stat

- name: List the podman secrets
  when: template_seal_podman_stat.stat.exists
  ansible.builtin.command:
    argv: ["{{ template_seal_podman }}", secret, ls, --noheading, --format, "{{ '{{' }}.Name{{ '}}' }}"]
  register: template_seal_podman_secrets
  changed_when: false

- name: Remove every podman secret
  when: template_seal_podman_stat.stat.exists and template_seal_podman_secrets.stdout_lines | length > 0
  ansible.builtin.command:
    argv: ["{{ template_seal_podman }}", secret, rm, --all]
  changed_when: true

# A removed CA anchor would otherwise stay in the extracted trust store.
- name: Rebuild the system trust store without the proxy's local CA
  ansible.builtin.command:
    argv: "{{ template_seal_trust_update_argv }}"
  changed_when: true
  when: >-
    template_seal_removed.results | selectattr('item', 'equalto', template_seal_proxy_ca_anchor)
    | selectattr('changed') | list | length > 0

- name: Find network profiles bound to the build VM
  ansible.builtin.find:
    paths: "{{ template_seal_network_profiles_find.paths }}"
    patterns: "{{ template_seal_network_profiles_find.patterns }}"
    file_type: file
  register: template_seal_network_profiles

# Deleting the keyfile does not take down the active connection; the build
# keeps its network until shutdown.
- name: Remove network profiles bound to the build VM
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ template_seal_network_profiles.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find shell history files
  ansible.builtin.find:
    paths:
      - /root
      - /home
    patterns:
      - '.bash_history'
      - '.sh_history'
      - '.zsh_history'
      - '.python_history'
      - '.lesshst'
    hidden: true
    recurse: true
    depth: 2
    file_type: file
  register: template_seal_history_files

- name: Remove shell history files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ template_seal_history_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find temporary files left by the build
  ansible.builtin.find:
    paths: "{{ template_seal_tmp_dirs }}"
    excludes:
      - "{{ template_seal_tmp_keep }}"
    file_type: any
    hidden: true
  register: template_seal_tmp_entries

- name: Remove temporary files left by the build
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ template_seal_tmp_entries.files }}"
  loop_control:
    label: "{{ item.path }}"

# Checked here, right after emptying them, not in finalize: finalize runs
# from Ansible's own payload under /tmp. Every module unpacks its payload
# there while it runs, so the listing is a raw command (no payload) and the
# verdict an assert (runs on the controller). Full seal only; a development
# template is not verified (owner decision, safbox-m5f.24).
- name: List what the scrub left in the temporary directories
  ansible.builtin.raw: >-
    find {{ template_seal_tmp_dirs | map('quote') | join(' ') }} -mindepth 1 -maxdepth 1
    ! -name {{ template_seal_tmp_keep | quote }} -print
  register: template_seal_tmp_left
  changed_when: false
  when: template_seal_mode == 'full'

- name: Assert the temporary directories are empty
  ansible.builtin.assert:
    that:
      - template_seal_tmp_leftovers | length == 0
    fail_msg: "temporary files present after the scrub: {{ template_seal_tmp_leftovers | join(', ') }}"
    quiet: true
  vars:
    template_seal_tmp_leftovers: "{{ template_seal_tmp_left.stdout_lines | map('trim') | select | list }}"
  when: template_seal_mode == 'full'

- name: Clean the package manager cache
  ansible.builtin.command:
    argv: "{{ template_seal_package_cache_clean_argv }}"
  changed_when: true

- name: Find installer residue
  ansible.builtin.find:
    paths: "{{ template_seal_installer_residue_find.paths }}"
    patterns: "{{ template_seal_installer_residue_find.patterns }}"
    file_type: file
  register: template_seal_installer_files

- name: Remove installer residue
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (template_seal_installer_files.files | map(attribute='path') | list)
       + template_seal_installer_residue_paths }}
