---
# site_config role: fits a SAFBox into the network of the site that deploys
# it (ADR-0001 §Phase 9 and later). Today one task group, the site's trusted
# CA bundles (safbox-site-config-1): each entry of safbox_trust_bundles in
# group_vars (the DoD PKI bundle by default) is fetched or copied, checked
# against its sha256, read as certificates, checked against the system
# crypto policy, and installed with the distribution's own trust store
# mechanism, one anchor file per certificate. Certificates of a bundle no
# longer listed are removed. Switched off by setting safbox_site_config_1
# to false; the group runs at build (baked into the image) or against a
# deployed box (--tags safbox-site-config-1, docs/reference/site-config.md).

# Downloads and archive members, in /var/tmp, which the seal clears.
site_config_trust_work_dir: /var/tmp/safbox-trust

# Services that read the trust store when they start. After the store
# changes, those running are restarted (on a deployed box; at build none
# runs). Their containers mount the host's store read-only.
site_config_trust_restart_units:
  - heimdall.service
  - vulcan.service
