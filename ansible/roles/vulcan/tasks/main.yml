---
- name: Vulcan
  when: safbox_vulcan_1 | default(true) | bool
  tags: [safbox-vulcan-1]
  block:
    # Pulled at build so a clone starts its pod offline.
    - name: Pull the Vulcan and PostgreSQL images
      containers.podman.podman_image:
        name: "{{ item }}"
        state: present
      loop:
        - "{{ vulcan_db_image }}"
        - "{{ vulcan_image }}"

    - name: Install the first-boot hook that generates Vulcan's secrets
      ansible.builtin.copy:
        src: 30-vulcan.sh
        dest: "{{ vulcan_firstboot_hook }}"
        owner: root
        group: root
        mode: '0755'

    # Read before the units are written, so the restart handler knows
    # whether this is a deployed box (secrets exist) or a build.
    - name: Check whether first boot has generated Vulcan's secrets
      ansible.builtin.stat:
        path: "{{ vulcan_env_file }}"
      register: vulcan_secrets

    - name: Install the Vulcan Quadlet units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ platform_container_quadlet_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - vulcan.network
        - vulcan.pod
        - vulcan-db.volume
        - vulcan-db.container
        - vulcan.container
      notify:
        - Reload systemd units
        - Restart Vulcan

    - name: Generate the units from the Quadlet files
      ansible.builtin.meta: flush_handlers

    # Quadlet-generated units are enabled by their [Install] section through
    # the generator; they are started, never enabled, with systemctl. At
    # build there are no secrets and nothing starts: first boot writes them
    # and the units follow it.
    - name: Start Vulcan on a deployed box
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop: "{{ vulcan_units }}"
      when: vulcan_secrets.stat.exists

    # The registry directory belongs to the safbox command (base group 2).
    - name: Register Vulcan with safbox services
      when: safbox_base_2 | default(true) | bool
      ansible.builtin.copy:
        dest: "{{ base_services_dir }}/30-vulcan"
        content: |
          label=Vulcan
          units={{ vulcan_units | join(' ') }}
        owner: root
        group: root
        mode: '0644'
