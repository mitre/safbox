---
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Only on a deployed box (its secrets exist); at build nothing runs. The pod
# alone: Quadlet binds each container unit to it (BindsTo) and makes the pod
# want them in order, so restarting the pod restarts the database and then
# the application, and a changed published port takes effect. Restarting
# the containers separately as well races with that restart and can fail
# the database's start ("Bound to unit vulcan-pod.service, but unit isn't
# active"). The restart reloads systemd itself first: several roles define
# a handler named "Reload systemd units", and on a deployed box the one this
# role's notification ran was seen to run after this restart, which then
# used the units generated from the old Quadlet files.
- name: Restart Vulcan
  ansible.builtin.systemd_service:
    name: vulcan-pod.service
    state: restarted
    daemon_reload: true
  when: vulcan_secrets.stat.exists | default(false)
