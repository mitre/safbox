---
- name: Load OS family variables
  tags: [always]
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', base_vars_lookup) }}"
  vars:
    base_vars_lookup:
      files:
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"

# Before the first-boot unit is enabled: a reboot after that would run first
# boot inside the template.
- name: Package updates
  when: safbox_base_3 | default(true) | bool
  tags: [safbox-base-3]
  block:
    # dnf needs-restarting (the reboot check) comes from dnf-plugins-core.
    - name: Install the reboot check (RHEL family)
      when: ansible_facts['os_family'] == 'RedHat'
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    # An update can pull in new kernels and dependencies; packages the STIG
    # removes stay out through excludepkgs in /etc/dnf/dnf.conf. update_only
    # states the intent (update, don't install by name); with name '*' dnf
    # upgrades everything either way.
    - name: Update every installed package (RHEL family)
      when: ansible_facts['os_family'] == 'RedHat'
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_only: true
        update_cache: true
      notify: Packages updated

    - name: Update every installed package (Debian family)
      when: ansible_facts['os_family'] == 'Debian'
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      notify: Packages updated

    # Reboot now, when the update needs it, so the rest of the play runs on
    # the updated system.
    - name: Reboot if the update needs it
      ansible.builtin.meta: flush_handlers

- name: First-boot framework
  when: safbox_base_1 | default(true) | bool
  tags: [safbox-base-1]
  block:
    # First boot is a local play run by the box's own ansible-core and its
    # collections (community.crypto for the proxy's certificate), which
    # the tools role installs; there is no network to fetch them then.
    - name: Refuse first boot without the box's ansible-core
      ansible.builtin.assert:
        that: safbox_tools_3 | default(true) | bool
        fail_msg: >-
          The first-boot play runs on the box's ansible-core and collections
          (tools task group 3): leave safbox_tools_3 on while safbox_base_1 is on.
        quiet: true

    - name: Install the packages the first-boot framework uses
      ansible.builtin.package:
        name: "{{ base_packages + base_family_packages }}"
        state: present

    - name: Create the root-only first-boot directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ base_firstboot_etc_dir }}"
        - "{{ base_firstboot_hook_dir }}"
        - "{{ base_firstboot_state_dir }}"

    - name: Create the helper library directory
      ansible.builtin.file:
        path: "{{ base_lib_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the secrets helper library
      ansible.builtin.copy:
        src: secrets.sh
        dest: "{{ base_lib_dir }}/secrets.sh"
        owner: root
        group: root
        mode: '0644'

    # It runs as root: root's alone to change. Only the play's YAML and its
    # configuration, so nothing else in the checkout reaches the image.
    - name: Create the first-boot play's directories
      ansible.builtin.file:
        path: "{{ base_firstboot_play_dir }}/{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ [{'path': ''}] + base_firstboot_play_tree | selectattr('state', 'eq', 'directory') | list }}"
      loop_control:
        label: "{{ base_firstboot_play_dir }}/{{ item.path }}"

    - name: Install the first-boot play and its roles
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ base_firstboot_play_dir }}/{{ item.path }}"
        owner: root
        group: root
        mode: '0644'
      loop: >-
        {{ base_firstboot_play_tree | selectattr('state', 'eq', 'file')
           | selectattr('path', 'search', '[.]yml$|^ansible[.]cfg$') | list }}
      loop_control:
        label: "{{ base_firstboot_play_dir }}/{{ item.path }}"

    - name: Write the first-boot play's vars from the site's switches
      ansible.builtin.template:
        src: firstboot-vars.yml.j2
        dest: "{{ base_firstboot_play_dir }}/vars.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Remove the shell runner the play replaced
      ansible.builtin.file:
        path: "{{ base_firstboot_retired_script }}"
        state: absent

    - name: Install the first-boot hook that hands a larger disk to the growing volumes
      ansible.builtin.copy:
        src: 10-grow-disk.sh
        dest: "{{ base_firstboot_hook_dir }}/10-grow-disk.sh"
        owner: root
        group: root
        mode: '0755'

    - name: Install the first-boot unit
      ansible.builtin.template:
        src: safbox-firstboot.service.j2
        dest: "/etc/systemd/system/{{ base_firstboot_unit }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd units

    - name: Register the unit with systemd before enabling it
      ansible.builtin.meta: flush_handlers

    # Enabled, never started here: starting it in the build would run first
    # boot inside the template and bake per-install state into the image.
    - name: Enable the first-boot unit
      ansible.builtin.systemd_service:
        name: "{{ base_firstboot_unit }}"
        enabled: true

    # The seal leaves /etc/machine-id "uninitialized", so a clone's first
    # boot is a systemd First Boot, which may reset every unit to its
    # preset policy, and the distribution's presets end in "disable *".
    - name: Create the systemd preset directory
      ansible.builtin.file:
        path: "{{ base_preset_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Keep the first-boot unit enabled through a First Boot preset
      ansible.builtin.copy:
        content: |
          # Written by the SAFBox base role: a First Boot preset leaves the
          # first-boot unit enabled.
          enable {{ base_firstboot_unit }}
        dest: "{{ base_preset_file }}"
        owner: root
        group: root
        mode: '0644'

- name: The safbox command
  when: safbox_base_2 | default(true) | bool
  tags: [safbox-base-2]
  block:
    - name: Create the command registry directory
      ansible.builtin.file:
        path: "{{ base_cli_commands_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the safbox dispatcher
      ansible.builtin.copy:
        src: safbox
        dest: "{{ base_cli_bin }}"
        owner: root
        group: root
        mode: '0755'

    - name: Register the built-in subcommands
      ansible.builtin.copy:
        src: "commands/{{ item }}"
        dest: "{{ base_cli_commands_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop: "{{ base_cli_commands }}"

- name: The SAF login greeting
  when: safbox_base_4 | default(true) | bool
  tags: [safbox-base-4]
  block:
    - name: Create the message of the day directory
      ansible.builtin.file:
        path: "{{ base_motd_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the SAF login greeting
      ansible.builtin.copy:
        src: motd
        dest: "{{ base_motd_file }}"
        owner: root
        group: root
        mode: '0644'

# safuser, the account for using the tools day to day, is made on each
# clone's first boot by the first-boot play's safuser role (ansible/firstboot/
# roles/safuser, run when this group is on), never in the template; the
# role also gives it sudo that asks for its password. Only admin, the
# account cloud-init creates, has passwordless sudo.
- name: The safuser account
  when: safbox_base_5 | default(true) | bool
  tags: [safbox-base-5]
  block:
    - name: Install the packages the safuser role uses
      ansible.builtin.package:
        name: "{{ base_safuser_packages }}"
        state: present

    - name: Remove the hook the safuser role replaced
      ansible.builtin.file:
        path: "{{ base_firstboot_hook_dir }}/15-safuser.sh"
        state: absent

# admin, cloud-init's default user, is the deployer's key-only account for
# deploying and automation. cloud-init creates it with passwordless sudo
# and a locked password; its first-boot hook exempts it from password
# ageing (the STIG's 60 days would otherwise end its key login) and hides
# it from the desktop login screen.
- name: The admin account
  when: safbox_base_6 | default(true) | bool
  tags: [safbox-base-6]
  block:
    - name: Install the packages the admin hook uses
      ansible.builtin.package:
        name: "{{ base_admin_packages }}"
        state: present

    - name: Install the first-boot hook that settles admin
      ansible.builtin.copy:
        src: 12-admin.sh
        dest: "{{ base_firstboot_hook_dir }}/12-admin.sh"
        owner: root
        group: root
        mode: '0755'
