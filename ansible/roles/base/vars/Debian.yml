---
# Debian family (Debian, Ubuntu) names, so the appliance layer can run on a
# Debian family host; untested until the Ubuntu source lands.

# growpart, for the disk-growing first-boot hook.
base_family_packages:
  - cloud-guest-utils

# pwmake and pwscore generate a password that meets the password quality
# policy (the first-boot play's safuser role).
base_safuser_packages:
  - libpwquality-tools

# jq reads cloud-init's configuration (the admin hook).
base_admin_packages:
  - jq
