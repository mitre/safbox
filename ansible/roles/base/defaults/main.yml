---
# base role: the base OS and SAFBox's own tooling on the box. It first
# brings every installed package up to date from the configured
# repositories, rebooting when the update needs it. The run-once first-boot
# framework owns every per-install secret, generated on first boot and not
# at build so no two installs share one; the `safbox` command and its
# subcommand registry give operators one entry point. Task groups are tagged
# safbox-base-<n> and switched off by setting safbox_base_<n> to
# false (see group_vars/all/main.yml).

base_firstboot_etc_dir: /etc/safbox
base_firstboot_hook_dir: /etc/safbox/firstboot.d
base_firstboot_state_dir: /var/lib/safbox
base_firstboot_done_marker: /var/lib/safbox/firstboot.done
base_lib_dir: /usr/local/lib/safbox
# The first-boot play (ansible/firstboot/), its roles and the vars the build
# writes for it; the unit runs it with the box's own ansible-core.
base_firstboot_play_dir: /usr/local/lib/safbox/firstboot
base_firstboot_play: "{{ base_firstboot_play_dir }}/firstboot.yml"
# The play's source: ansible/firstboot/ in this repository, beside the
# build's own playbooks, with roles of its own.
base_firstboot_play_src: "{{ role_path }}/../../firstboot/"
base_firstboot_play_tree: "{{ query('community.general.filetree', base_firstboot_play_src) }}"
# The shell runner the play replaced, removed from boxes built before it.
base_firstboot_retired_script: /usr/local/sbin/safbox-firstboot
base_firstboot_unit: safbox-firstboot.service
# Keeps the unit enabled through the preset a First Boot may apply (the
# seal leaves /etc/machine-id "uninitialized").
base_preset_file: /etc/systemd/system-preset/50-safbox-base.preset

# The play's steps that are roles, each run when its task group is on (the
# proxy's is the services role's); the step name orders it among the hooks
# in firstboot.d, as the hook it replaced was ordered.
base_firstboot_roles:
  - step: 15-safuser
    role: safuser
    enabled: "{{ safbox_base_5 | default(true) }}"
  - step: 40-proxy
    role: proxy_tls
    enabled: "{{ safbox_services_3 | default(true) }}"

# Units that must wait for first boot to finish (the service pods of later
# phases). Service roles append their unit names; each Quadlet unit should
# also declare After=safbox-firstboot.service on its own side.
base_firstboot_before_units: []

base_cli_bin: /usr/local/bin/safbox
base_cli_commands_dir: /usr/local/lib/safbox/commands
# Subcommands this role ships (files/commands/<name>). Later roles register
# their own by installing an executable into base_cli_commands_dir.
base_cli_commands:
  - status

# The SAF logo and a pointer to `safbox status`, shown after every console
# and SSH login. A drop-in in pam_motd's directory, so /etc/motd stays the
# site's and the login banner before the password prompt (/etc/issue, a
# STIG setting) is untouched.
base_motd_file: /etc/motd.d/safbox
