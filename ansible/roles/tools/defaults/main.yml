---
# tools role: the assessment and build tools a SAFBox ships (ADR-0001
# Phase 3): CINC Auditor, the SAF CLI, Ansible with the collections the
# Lockdown STIG role needs, and Packer. Pins live in
# group_vars/all/main.yml and are overridable per site. Task groups are
# tagged safbox-tools-<n> and switched off by setting safbox_tools_<n> to
# false.

# SAF CLI: a global npm install under npm's global prefix (/usr/local on
# the RHEL family), which links the saf command into /usr/local/bin. The
# installed package's manifest records its version; npm's cache goes in
# /var/tmp, which the seal clears.
tools_saf_cli_manifest: /usr/local/lib/node_modules/@mitre/saf/package.json
tools_saf_cli_npm_cache: /var/tmp/safbox-npm-cache

# Ansible collections go in the system-wide collection path every user's
# ansible-core searches by default.
tools_ansible_collections_path: /usr/share/ansible/collections
# ansible-galaxy's API cache during the install, in /var/tmp so the seal
# clears it.
tools_ansible_galaxy_cache: /var/tmp/safbox-galaxy-cache

# Packer: the unmodified binary, and its license text beside it (the
# Business Source License asks that it accompany every copy).
tools_packer_bin: /usr/local/bin/packer
tools_packer_license_dir: /usr/local/share/licenses/packer
