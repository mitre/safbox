---
tools_cinc_auditor_package: cinc-auditor

# The distribution's Node.js 22 stream, built against the system OpenSSL, so
# the SAF CLI's crypto runs through the OpenSSL FIPS provider.
tools_saf_cli_packages:
  - nodejs
  - nodejs-npm

# dnf package spec for the pinned upstream ansible-core version.
tools_ansible_core_package: "ansible-core-{{ safbox_tool_ansible_core.version }}"

# unarchive needs unzip to unpack the Packer release zip.
tools_packer_packages:
  - unzip
