---
# Debian family. Present per ADR-0001 but untested: the pinned CINC Auditor
# artifact is an RPM, and the distribution's ansible-core and Node.js
# versions differ from the RHEL family's, so a Debian site overrides the
# CINC Auditor and ansible-core pins in its local vars file.

# Node.js from the distribution, linked against the system OpenSSL; npm is
# packaged separately.
tools_saf_cli_packages:
  - nodejs
  - npm

# apt package spec for the pinned upstream ansible-core version; the
# trailing glob matches the distribution's revision suffix.
tools_ansible_core_package: "ansible-core={{ safbox_tool_ansible_core.version }}*"
