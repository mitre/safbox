---
- name: Load OS family variables
  tags: [always]
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', tools_vars_lookup) }}"
  vars:
    tools_vars_lookup:
      files:
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: CINC Auditor
  when: safbox_tools_1 | default(true) | bool
  tags: [safbox-tools-1]
  vars:
    tools_cinc_download: "/var/tmp/{{ safbox_tool_cinc_auditor.url | basename }}"
  block:
    # Downloads stay in /var/tmp, which the seal clears; get_url skips a
    # file already there with the pinned checksum, and installing the same
    # package again changes nothing.
    - name: Download the CINC Auditor package and verify its checksum
      ansible.builtin.get_url:
        url: "{{ safbox_tool_cinc_auditor.url }}"
        dest: "{{ tools_cinc_download }}"
        checksum: "sha256:{{ safbox_tool_cinc_auditor.sha256 }}"
        owner: root
        group: root
        mode: '0600'

    # CINC publishes its packages unsigned, so there is no signature to
    # check. The integrity guarantee is the pinned sha256 verified by the
    # download above; the GPG check is waived for that one verified file.
    - name: Install the checksum-verified CINC Auditor package
      ansible.builtin.package:
        name: "{{ tools_cinc_download }}"
        state: present
        disable_gpg_check: true

- name: SAF CLI
  when: safbox_tools_2 | default(true) | bool
  tags: [safbox-tools-2]
  block:
    - name: Install Node.js and npm from the distribution
      ansible.builtin.package:
        name: "{{ tools_saf_cli_packages }}"
        state: present

    # The installed package's own manifest is the state: npm runs only when
    # it is absent or names another version (npm install reaches the
    # registry and reinstalls every time it runs).
    - name: Read the installed SAF CLI version
      ansible.builtin.slurp:
        src: "{{ tools_saf_cli_manifest }}"
      register: tools_saf_cli_installed
      failed_when: false

    - name: Install the pinned SAF CLI
      when: >-
        tools_saf_cli_installed.content is not defined
        or (tools_saf_cli_installed.content | b64decode | from_json).version
           != safbox_tool_saf_cli.version | string
      block:
        # Pinned at the root dependency: the SAF CLI version is exact and npm
        # resolves its dependencies. The global install links the saf command
        # onto the default PATH. No package scripts run as root.
        - name: Install the SAF CLI from the npm registry
          ansible.builtin.command:
            argv:
              - npm
              - install
              - --global
              - --ignore-scripts
              - --no-audit
              - --no-fund
              # In /var/tmp, which the seal clears, not root's home.
              - --cache
              - "{{ tools_saf_cli_npm_cache }}"
              - "@mitre/saf@{{ safbox_tool_saf_cli.version }}"
          environment:
            NPM_CONFIG_UPDATE_NOTIFIER: "false"
          changed_when: true

- name: Ansible and the Lockdown STIG collections
  when: safbox_tools_3 | default(true) | bool
  tags: [safbox-tools-3]
  block:
    - name: Install the pinned ansible-core from the distribution
      ansible.builtin.package:
        name: "{{ tools_ansible_core_package }}"
        state: present

    # Explicitly world-readable, so every user's ansible-core finds the
    # collections whatever root's umask is.
    - name: Create the system-wide collection directory
      ansible.builtin.file:
        path: "{{ tools_ansible_collections_path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Pinned at the root: each collection at its exact version, with Galaxy
    # resolving any dependencies. A collection at another version is
    # replaced; when every one is already in place ansible-galaxy reports
    # nothing to do. Its API cache goes in /var/tmp,
    # which the seal clears.
    - name: Install the pinned collections system-wide
      ansible.builtin.command:
        argv: >-
          {{ ['ansible-galaxy', 'collection', 'install', '-p', tools_ansible_collections_path]
             + safbox_tool_ansible_collections | map(attribute='name')
               | zip(safbox_tool_ansible_collections | map(attribute='version'))
               | map('join', ':==') | list }}
      environment:
        ANSIBLE_NOCOLOR: "1"
        ANSIBLE_GALAXY_CACHE_DIR: "{{ tools_ansible_galaxy_cache }}"
      register: tools_ansible_collections_install
      changed_when: "'was installed successfully' in tools_ansible_collections_install.stdout"

- name: HashiCorp Packer
  when: safbox_tools_4 | default(true) | bool
  tags: [safbox-tools-4]
  vars:
    tools_packer_download: "/var/tmp/{{ safbox_tool_packer.url | basename }}"
  block:
    - name: Install the packages that unpack the Packer release
      ansible.builtin.package:
        name: "{{ tools_packer_packages }}"
        state: present

    # In /var/tmp, which the seal clears; get_url skips a file already
    # there with the pinned checksum.
    - name: Download the Packer release and verify its checksum
      ansible.builtin.get_url:
        url: "{{ safbox_tool_packer.url }}"
        dest: "{{ tools_packer_download }}"
        checksum: "sha256:{{ safbox_tool_packer.sha256 }}"
        owner: root
        group: root
        mode: '0600'

    # The binary keeps its release name, packer, in the directory of
    # tools_packer_bin.
    - name: Install the Packer binary from the checksum-verified release
      ansible.builtin.unarchive:
        src: "{{ tools_packer_download }}"
        dest: "{{ tools_packer_bin | dirname }}"
        include: [packer]
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Create the Packer license directory
      ansible.builtin.file:
        path: "{{ tools_packer_license_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the Packer license beside the binary
      ansible.builtin.unarchive:
        src: "{{ tools_packer_download }}"
        dest: "{{ tools_packer_license_dir }}"
        include: [LICENSE.txt]
        remote_src: true
        owner: root
        group: root
        mode: '0644'
