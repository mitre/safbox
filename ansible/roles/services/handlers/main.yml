---
# One systemd reload for the role, defined first so that, when a service's
# Quadlet files change, it runs before that service's restart.
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Only on a deployed box (its secrets exist); at build nothing runs. The pod
# alone: Quadlet binds each container unit to it (BindsTo) and makes the pod
# want them in order, so restarting the pod restarts the database and then
# the application, and a changed published port takes effect. Restarting
# the containers separately as well races with that restart and can fail
# the database's start ("Bound to unit heimdall-pod.service, but unit isn't
# active"). The restart reloads systemd itself first: other roles also
# define a handler named "Reload systemd units", and on a deployed box the
# one a notification ran was seen to run after this restart, which then
# used the units generated from the old Quadlet files.
- name: Restart Heimdall
  ansible.builtin.systemd_service:
    name: heimdall-pod.service
    state: restarted
    daemon_reload: true
  when: services_heimdall_secrets.stat.exists | default(false)

# As for Heimdall: the pod alone, after its own systemd reload, and only on
# a deployed box.
- name: Restart Vulcan
  ansible.builtin.systemd_service:
    name: vulcan-pod.service
    state: restarted
    daemon_reload: true
  when: services_vulcan_secrets.stat.exists | default(false)

# As for Heimdall: the pod alone, after its own systemd reload, and only on
# a deployed box.
- name: Restart Keycloak
  ansible.builtin.systemd_service:
    name: keycloak-pod.service
    state: restarted
    daemon_reload: true
  when: services_keycloak_secrets.stat.exists | default(false)

# Only on a deployed box (its certificate exists); at build nothing runs.
- name: Restart the proxy
  ansible.builtin.systemd_service:
    name: safbox-proxy.service
    state: restarted
  when: services_proxy_tls.stat.exists | default(false)
