---
# Every long-running service of the appliance, one task file and one task
# group per service. Each group's block imports its file statically, so the
# group's tag and switch reach every task in it (--tags safbox-services-<n>
# runs the whole service; include_tasks would pass neither). The proxy is
# last: it fronts whichever applications are switched on.
- name: Heimdall
  when: safbox_services_1 | default(true) | bool
  tags: [safbox-services-1]
  block:
    - name: Heimdall and its PostgreSQL
      ansible.builtin.import_tasks: heimdall.yml

- name: Vulcan
  when: safbox_services_2 | default(true) | bool
  tags: [safbox-services-2]
  block:
    - name: Vulcan and its PostgreSQL
      ansible.builtin.import_tasks: vulcan.yml

- name: TLS proxy
  when: safbox_services_3 | default(true) | bool
  tags: [safbox-services-3]
  block:
    - name: The nginx TLS proxy for the enabled applications
      ansible.builtin.import_tasks: proxy.yml
