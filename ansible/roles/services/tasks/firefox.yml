---
# Firefox bookmarks for the box's services: task group safbox-services-4,
# imported by tasks/main.yml, which applies the group's tag, its switch
# safbox_services_4 and the desktop guard (see defaults).

- name: Create Firefox's system policy directory
  ansible.builtin.file:
    path: "{{ services_firefox_policies_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set the bookmarks through Firefox's enterprise policy
  ansible.builtin.template:
    src: policies.json.j2
    dest: "{{ services_firefox_policies_file }}"
    owner: root
    group: root
    mode: '0644'
