---
# Heimdall and its PostgreSQL as a podman pod of Quadlet units: task group
# safbox-services-1, imported by tasks/main.yml, which applies the group's
# tag and its switch safbox_services_1.

# Pulled at build so a clone starts its pod offline.
- name: Pull the Heimdall and PostgreSQL images
  containers.podman.podman_image:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ services_heimdall_db_image }}"
    - "{{ services_heimdall_image }}"

- name: Install the first-boot hook that generates Heimdall's secrets
  ansible.builtin.copy:
    src: 20-heimdall.sh
    dest: "{{ services_heimdall_firstboot_hook }}"
    owner: root
    group: root
    mode: '0755'

# Read before the units are written, so the restart handler knows
# whether this is a deployed box (secrets exist) or a build.
- name: Check whether first boot has generated Heimdall's secrets
  ansible.builtin.stat:
    path: "{{ services_heimdall_env_file }}"
  register: services_heimdall_secrets

# The PostgreSQL settings and access list the database container mounts
# (defaults/main.yml, PostgreSQL).
- name: Create the directory of the PostgreSQL configuration
  ansible.builtin.file:
    path: "{{ services_postgresql_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the configuration of Heimdall's PostgreSQL
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ services_postgresql_conf_dir }}/heimdall-{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - postgresql.conf
    - pg_hba.conf
  vars:
    services_postgresql_app: Heimdall
    services_postgresql_user: "{{ services_heimdall_db_user }}"
  notify:
    - Restart Heimdall

- name: Install the Heimdall Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ platform_container_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - heimdall.network
    - heimdall.pod
    - heimdall-db.volume
    - heimdall-db.container
    - heimdall.container
  notify:
    - Reload systemd units
    - Restart Heimdall

- name: Generate the units from the Quadlet files
  ansible.builtin.meta: flush_handlers

# Quadlet-generated units are enabled by their [Install] section through
# the generator; they are started, never enabled, with systemctl. At
# build there are no secrets and nothing starts: first boot writes them
# and the units follow it.
- name: Start Heimdall on a deployed box
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - heimdall-pod.service
    - heimdall-db.service
    - heimdall.service
  when: services_heimdall_secrets.stat.exists
