---
# Vulcan and its PostgreSQL as a podman pod of Quadlet units (ADR-0001
# Phase 6): task group safbox-services-2, imported by tasks/main.yml, which
# applies the group's tag and its switch safbox_services_2.

# Pulled at build so a clone starts its pod offline.
- name: Pull the Vulcan and PostgreSQL images
  containers.podman.podman_image:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ services_vulcan_db_image }}"
    - "{{ services_vulcan_image }}"

- name: Install the first-boot hook that generates Vulcan's secrets
  ansible.builtin.copy:
    src: 30-vulcan.sh
    dest: "{{ services_vulcan_firstboot_hook }}"
    owner: root
    group: root
    mode: '0755'

# Read before the units are written, so the restart handler knows
# whether this is a deployed box (secrets exist) or a build.
- name: Check whether first boot has generated Vulcan's secrets
  ansible.builtin.stat:
    path: "{{ services_vulcan_env_file }}"
  register: services_vulcan_secrets

- name: Install the Vulcan Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ platform_container_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - vulcan.network
    - vulcan.pod
    - vulcan-db.volume
    - vulcan-db.container
    - vulcan.container
  notify:
    - Reload systemd units
    - Restart Vulcan

- name: Generate the units from the Quadlet files
  ansible.builtin.meta: flush_handlers

# Quadlet-generated units are enabled by their [Install] section through
# the generator; they are started, never enabled, with systemctl. At
# build there are no secrets and nothing starts: first boot writes them
# and the units follow it.
- name: Start Vulcan on a deployed box
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - vulcan-pod.service
    - vulcan-db.service
    - vulcan.service
  when: services_vulcan_secrets.stat.exists
