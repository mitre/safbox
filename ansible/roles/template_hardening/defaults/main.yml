---
# template_hardening role: applies the RHEL 10 STIG to the appliance with the Ansible
# Lockdown role pinned in group_vars (safbox_hardening_lockdown), as the last
# role of the appliance play, so the STIG covers everything the roles before
# it installed. The task group is tagged safbox-hardening-1 and switched off
# by setting safbox_hardening_1 to false.
#
# What is applied is decided by:
#   - the Lockdown role's own variables (rhel10stig_* in its defaults), which
#     a site sets in ansible/local.yml to make its own risk decisions;
#   - the Lockdown rules SAFBox switches off, one per line in group_vars:
#     deviations (Not Applicable, with their justification, in the STIG
#     overlay) and rules whose Lockdown task fails on SAFBox.

# Where ansible-galaxy records, inside an installed role, the version it
# installed; used to refuse a Lockdown release other than the pin.
template_hardening_lockdown_install_info: meta/.galaxy_install_info

# Packages Lockdown's own tasks need, installed before it runs: its prelim
# installs acl only with RHEL-10-700400 to 700430 all on, and 700410 is off
# (group_vars), but its ACL tasks (RHEL-10-400240, 600180) still use setfacl.
template_hardening_lockdown_packages:
  - acl

# The hardening record: which Lockdown release and STIG release were applied
# and which rules were left out. Not a secret; beside the seal's build record.
template_hardening_record_path: /usr/local/share/safbox/hardening

# STIG settings SAFBox applies itself, after Lockdown, where Lockdown's own
# task is switched off because it fails (group_vars, "Lockdown task fails")
# or cannot act at build time (accounts first boot makes).

# AIDE (RHEL-10-200631 to 200635): the configuration, the daily check anacron
# runs (run-parts /etc/cron.daily), and the unit that makes the database on
# a deployed box's first boot, after the first-boot play, so the database
# describes that box and never the build VM.
template_hardening_aide_conf: /etc/aide.conf
template_hardening_aide_daily: /etc/cron.daily/aide
template_hardening_aide_db: /var/lib/aide/aide.db.gz
template_hardening_aide_db_new: /var/lib/aide/aide.db.new.gz
template_hardening_aide_init_unit: safbox-aide-init.service
# Files under an AIDE-watched directory that the box rewrites by design:
# the start page's service status, rewritten every minute.
template_hardening_aide_excludes:
  - /etc/safbox-proxy/html/status.json

# RHEL-10-400235: the dotfiles new accounts start with (admin, made by
# cloud-init, and safuser, by first boot, both with useradd -m), given mode
# 0740 or less.
template_hardening_skel_dir: /etc/skel

# RHEL-10-700950: Ctrl-Alt-Delete pressed repeatedly does nothing.
template_hardening_ctrlaltdel_dropin: /etc/systemd/system.conf.d/55-safbox-ctrl-alt-del-burst.conf

# RHEL-10-700860: the bluetooth kernel module cannot be loaded.
template_hardening_bluetooth_modprobe: /etc/modprobe.d/safbox-bluetooth.conf

# RHEL-10-200562: USBGuard's rule list (its implicit policy blocks every
# device no rule allows).
template_hardening_usbguard_rules: /etc/usbguard/rules.d/50-safbox-hubs.conf

# RHEL-10-900100: audit rules immutable until the next boot (-e 2).
template_hardening_audit_immutable_rules: /etc/audit/rules.d/99-safbox-immutable.rules

# RHEL-10-600700, 600710, 600720: the authselect profile SAFBox selects, a
# copy of the distribution's local profile whose pam_unix password lines
# hash with SHA-512 and rhel10stig_pam_rounds rounds instead of yescrypt.
template_hardening_authselect_profile: safbox
template_hardening_authselect_base: local

# RHEL-10-600450: accounts the distribution creates that have no purpose
# on SAFBox (setup package).
template_hardening_unneeded_accounts:
  - games
  - ftp
# The setup package declares them for systemd-sysusers, which recreates
# missing accounts on a boot after an update and when rpm installs or
# updates setup. A file of the same name in /etc/sysusers.d replaces the
# package's: the role writes the package's declarations without those
# accounts there.
template_hardening_sysusers_vendor: /usr/lib/sysusers.d/20-setup-users.conf
template_hardening_sysusers_override: /etc/sysusers.d/20-setup-users.conf
