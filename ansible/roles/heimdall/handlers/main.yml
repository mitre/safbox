---
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Only on a deployed box (its secrets exist); at build nothing runs. The pod
# first, so a changed published port takes effect, then its containers.
- name: Restart Heimdall
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - heimdall-pod.service
    - heimdall-db.service
    - heimdall.service
  when: heimdall_secrets.stat.exists | default(false)
