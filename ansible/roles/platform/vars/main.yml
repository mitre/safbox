---
# Names common to every OS family. A vars/<os_family>.yml file, loaded by
# the role, overrides a name here only where that family differs.

platform_firewalld_services:
  - ssh

# Desktop branding (task group 7), the same on every OS family. Each file
# is in files/desktop/, pinned by sha256 and recorded with where it came
# from (a source, and the commit it was taken at); the role checks every
# installed copy against its sha256.
#
# The wallpapers, listed for GNOME Settings; the navy one is a new user's
# default.
platform_desktop_background_dir: /usr/share/backgrounds/safbox
platform_desktop_backgrounds:
  - name: SAF navy
    file: desktop/saf-navy-3440x1440.png
    dest: "{{ platform_desktop_background_dir }}/saf-navy-3440x1440.png"
    sha256: 76a8558e8a1f175772566a690300ec7893da404a451c25a8f62d5bfa2ec10854
    source: the safbox repository, branch wallpaper
    commit: 6cec81d41dda913f31682b8003c165fe0475aefe
  - name: SAF dark
    file: desktop/saf-dark-3440x1440.png
    dest: "{{ platform_desktop_background_dir }}/saf-dark-3440x1440.png"
    sha256: c48f634bbfb12c5769fd3945e76eeb5b8eb5c6390d034181429ffbf213c8f75e
    source: the safbox repository, branch wallpaper
    commit: 6cec81d41dda913f31682b8003c165fe0475aefe
  - name: SAF light
    file: desktop/saf-light-3440x1440.png
    dest: "{{ platform_desktop_background_dir }}/saf-light-3440x1440.png"
    sha256: 30e615d2914945ac65b162e1e962234dc12e4bad123bc606045b996189ffe2ba
    source: the safbox repository, branch wallpaper
    commit: 6cec81d41dda913f31682b8003c165fe0475aefe
platform_desktop_background_default: saf-navy-3440x1440.png

# The login screen's logo: the SAF shield from mitre/saf-site, transparent.
# GDM loads SVG through gdk-pixbuf's librsvg loader, so it is installed as
# is.
platform_desktop_logo:
  file: desktop/saf-logo.svg
  dest: /usr/share/pixmaps/saf-logo.svg
  sha256: cab58731383e39ded37dc908960fecc996760bd8a2e22033ed4605ba125afe0f
  source: https://github.com/mitre/saf-site/blob/{commit}/docs/public/icons/saf-logo.svg
  commit: b795b9c2b8d89f1686797973bcc44c5274eb1ea1

# A new user's profile picture: the same SAF logo on white, 256x256,
# rendered once from the logo above with
#   magick -background white -density 600 saf-logo.svg -resize 208x208 \
#     -gravity center -extent 256x256 -flatten saf-avatar.png
platform_desktop_avatar:
  file: desktop/saf-avatar.png
  dest: /usr/share/pixmaps/saf-avatar.png
  sha256: c3e4a528cd25863869d0922df994600124344466e2b0e4432dac4ea898b7c364
  source: rendered from the logo above (mitre/saf-site saf-logo.svg)
  commit: b795b9c2b8d89f1686797973bcc44c5274eb1ea1

# The terminal (Ptyxis) palette "SAF Navy": the navy wallpaper's colour as
# the background, the logo's blue for the cursor. Ptyxis reads palettes only
# from the user's own data directory, so it goes into /etc/skel, which every
# account created afterwards starts from.
platform_desktop_palette:
  file: desktop/saf.palette
  dest: /etc/skel/.local/share/org.gnome.Ptyxis/palettes/saf.palette
  mode: "0600"
  sha256: 83e92e0c659dd9aa00cc6c9c04baccae60822f030698be5e43f44ba268d134d3
  source: written for SAFBox (this repository)

# Ptyxis keeps its profiles in dconf under an id. A new user's profile list
# defaults to this one profile, whose palette is SAF Navy; without it Ptyxis
# creates a profile with a random id on first start, which no system
# default can name.
platform_desktop_terminal_profile: a64f2cd413c97b9f9cdb8f7438946c23

# dconf system databases: "local", which every user's profile
# (/etc/dconf/profile/user) reads, and "gdm", which the login screen's
# profile (/usr/share/dconf/profile/gdm) reads. Every setting SAFBox puts
# there is a default, never a lock, so users may change it.
platform_desktop_dconf_user_db: local
platform_desktop_dconf_gdm_db: gdm

# AccountsService gives every user without their own settings the values of
# its user templates (standard, or administrator for wheel members), from
# /etc/accountsservice/user-templates/ before the distribution's
# /usr/share/accountsservice/user-templates/. SAFBox's copies set the
# profile picture.
platform_desktop_user_templates: [standard, administrator]

# Every branding file the role installs.
platform_desktop_assets: >-
  {{ platform_desktop_backgrounds
     + [platform_desktop_logo, platform_desktop_avatar, platform_desktop_palette] }}
