---
# Debian family (Debian, Ubuntu) names. Present per ADR-0001 but untested
# until the Ubuntu source lands.
platform_packages:
  - chrony
  - sudo
  - openssh-server
  - firewalld
  - qemu-guest-agent
  - cloud-init
platform_services_enabled:
  - ssh
  - chrony
  - firewalld
  - qemu-guest-agent
  - cloud-init
platform_container_packages:
  - podman
  - golang-github-containers-common
# AppArmor, not SELinux, on this family.
platform_selinux_required: false
# The host's CA bundle, mounted read-only into the service containers where
# their Red Hat UBI images read theirs.
platform_container_trust_volume: /etc/ssl/certs/ca-certificates.crt:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro
