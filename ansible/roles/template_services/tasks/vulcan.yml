---
# Vulcan and its PostgreSQL as a podman pod of Quadlet units: task group
# safbox-services-2, imported by tasks/main.yml, which applies the group's
# tag and its switch safbox_services_2.

# Pulled at build so a clone starts its pod offline.
- name: Pull the Vulcan and PostgreSQL images
  containers.podman.podman_image:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ template_services_vulcan_db_image }}"
    - "{{ template_services_vulcan_image }}"

# Read before the units are written, so the restart handler knows
# whether this is a deployed box (secrets exist) or a build: the secret
# the database container reads exists once first boot has made Vulcan's.
- name: Check whether first boot has made Vulcan's secrets
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - exists
      - "{{ (template_services_secrets | selectattr('env.vulcan-db', 'defined') | first).name }}"
  register: template_services_vulcan_secrets
  changed_when: false
  failed_when: template_services_vulcan_secrets.rc not in [0, 1]

# The PostgreSQL settings and access list the database container mounts
# (defaults/main.yml, PostgreSQL).
- name: Create the directory of the PostgreSQL configuration
  ansible.builtin.file:
    path: "{{ template_services_postgresql_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the configuration of Vulcan's PostgreSQL
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ template_services_postgresql_conf_dir }}/vulcan-{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - postgresql.conf
    - pg_hba.conf
  vars:
    template_services_postgresql_app: Vulcan
    template_services_postgresql_user: "{{ template_services_vulcan_db_user }}"
  notify:
    - Restart Vulcan

- name: Install the Vulcan Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ template_os_container_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - vulcan.network
    - vulcan.pod
    - vulcan-db.volume
    - vulcan-db.container
    - vulcan.container
  notify:
    - Reload systemd units
    - Restart Vulcan

- name: Generate the units from the Quadlet files
  ansible.builtin.meta: flush_handlers

# Quadlet-generated units are enabled by their [Install] section through
# the generator; they are started, never enabled, with systemctl. At
# build there are no secrets and nothing starts: first boot makes them
# and the units follow it.
- name: Start Vulcan on a deployed box
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - vulcan-pod.service
    - vulcan-db.service
    - vulcan.service
  when: template_services_vulcan_secrets.rc == 0
