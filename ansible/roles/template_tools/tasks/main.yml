---
- name: CINC Auditor
  when: safbox_tools_cinc_auditor | default(true) | bool
  tags: [safbox-tools-cinc-auditor]
  vars:
    template_tools_cinc_download: "/var/tmp/{{ safbox_tool_cinc_auditor.url | basename }}"
  block:
    # Downloads stay in /var/tmp, which the seal clears; get_url skips a
    # file already there with the pinned checksum, and installing the same
    # package again changes nothing.
    - name: Download the CINC Auditor package and verify its checksum
      ansible.builtin.get_url:
        url: "{{ safbox_tool_cinc_auditor.url }}"
        dest: "{{ template_tools_cinc_download }}"
        checksum: "sha256:{{ safbox_tool_cinc_auditor.sha256 }}"
        owner: root
        group: root
        mode: '0600'

    # CINC publishes its packages unsigned, so there is no signature to
    # check. The integrity guarantee is the pinned sha256 verified by the
    # download above; the GPG check is waived for that one verified file.
    - name: Install the checksum-verified CINC Auditor package
      ansible.builtin.package:
        name: "{{ template_tools_cinc_download }}"
        state: present
        disable_gpg_check: true

- name: SAF CLI
  when: safbox_tools_saf_cli | default(true) | bool
  tags: [safbox-tools-saf-cli]
  block:
    - name: Install Node.js and npm from the distribution
      ansible.builtin.package:
        name: "{{ template_tools_saf_cli_packages }}"
        state: present

    # The lockfile in files/saf-cli pins the SAF CLI and its whole
    # dependency tree, each package by its integrity hash. Its one
    # dependency must be the version group_vars pins.
    - name: Check the SAF CLI lockfile is for the pinned version
      ansible.builtin.assert:
        that: >-
          (lookup('ansible.builtin.file', 'saf-cli/package.json') | from_json).dependencies['@mitre/saf']
          == safbox_tool_saf_cli.version | string
        fail_msg: >-
          files/saf-cli/package.json does not name @mitre/saf {{ safbox_tool_saf_cli.version }};
          update it and regenerate package-lock.json with npm.
        quiet: true

    - name: Create the SAF CLI install directory
      ansible.builtin.file:
        path: "{{ template_tools_saf_cli_prefix }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy the SAF CLI package manifest and lockfile
      ansible.builtin.copy:
        src: "saf-cli/{{ item }}"
        dest: "{{ template_tools_saf_cli_prefix }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [package.json, package-lock.json]
      register: template_tools_saf_cli_lockfile

    - name: Check whether the SAF CLI is installed
      ansible.builtin.stat:
        path: "{{ template_tools_saf_cli_prefix }}/node_modules/@mitre/saf/package.json"
      register: template_tools_saf_cli_installed

    # npm ci installs exactly the locked tree and fails if any package's
    # hash differs. It deletes and rebuilds node_modules every time, so it
    # runs only when the lockfile changed or the SAF CLI is missing. No
    # package scripts run as root.
    - name: Install the SAF CLI from its lockfile
      when: template_tools_saf_cli_lockfile.changed or not template_tools_saf_cli_installed.stat.exists
      ansible.builtin.command:
        argv:
          - npm
          - ci
          - --ignore-scripts
          - --no-audit
          - --no-fund
          # In /var/tmp, which the seal clears, not root's home.
          - --cache
          - "{{ template_tools_saf_cli_npm_cache }}"
        chdir: "{{ template_tools_saf_cli_prefix }}"
      environment:
        NPM_CONFIG_UPDATE_NOTIFIER: "false"
      changed_when: true

    - name: Link the saf command onto the default PATH
      ansible.builtin.file:
        src: "{{ template_tools_saf_cli_prefix }}/node_modules/.bin/saf"
        dest: "{{ template_tools_saf_cli_bin }}"
        state: link

- name: Ansible and the Lockdown STIG collections
  tags: [safbox-tools-ansible]
  block:
    - name: Install the pinned ansible-core, and git for the collections, from the distribution
      ansible.builtin.package:
        name:
          - "{{ template_tools_ansible_core_package }}"
          - "{{ template_tools_git_package }}"
        state: present

    # Explicitly world-readable, so every user's ansible-core finds the
    # collections whatever root's umask is.
    - name: Create the system-wide collection directory
      ansible.builtin.file:
        path: "{{ template_tools_ansible_collections_path }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    # ansible-galaxy rebuilds a git source every time it is asked, so read
    # what is installed and install only a collection that is missing or at
    # another version. A missing manifest is not an error here.
    - name: Read the installed collections' manifests
      vars:
        template_tools_collections_root: "{{ template_tools_ansible_collections_path }}/ansible_collections"
      ansible.builtin.slurp:
        src: "{{ template_tools_collections_root }}/{{ item.name | replace('.', '/') }}/MANIFEST.json"
      loop: "{{ safbox_tool_ansible_collections }}"
      loop_control:
        label: "{{ item.name }}"
      register: template_tools_ansible_collections_installed
      failed_when: false

    # Each collection from its git repository at the pinned commit
    # (git+<url>,<commit>). --offline keeps Galaxy out of it, so a dependency
    # that is not listed fails the install instead of resolving unpinned.
    # Its API cache goes in /var/tmp, which the seal clears.
    - name: Install the pinned collections system-wide
      when: >-
        item.content is not defined
        or (item.content | b64decode | from_json).collection_info.version != item.item.version | string
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - install
          - --offline
          - -p
          - "{{ template_tools_ansible_collections_path }}"
          - "git+{{ item.item.src }},{{ item.item.commit }}"
      loop: "{{ template_tools_ansible_collections_installed.results }}"
      loop_control:
        label: "{{ item.item.name }} {{ item.item.version }}"
      environment:
        ANSIBLE_NOCOLOR: "1"
        ANSIBLE_GALAXY_CACHE_DIR: "{{ template_tools_ansible_galaxy_cache }}"
      changed_when: true

- name: HashiCorp Packer
  when: safbox_tools_packer | default(true) | bool
  tags: [safbox-tools-packer]
  vars:
    template_tools_packer_download: "/var/tmp/{{ safbox_tool_packer.url | basename }}"
  block:
    - name: Install the packages that unpack the Packer release
      ansible.builtin.package:
        name: "{{ template_tools_packer_packages }}"
        state: present

    # In /var/tmp, which the seal clears; get_url skips a file already
    # there with the pinned checksum.
    - name: Download the Packer release and verify its checksum
      ansible.builtin.get_url:
        url: "{{ safbox_tool_packer.url }}"
        dest: "{{ template_tools_packer_download }}"
        checksum: "sha256:{{ safbox_tool_packer.sha256 }}"
        owner: root
        group: root
        mode: '0600'

    # The binary keeps its release name, packer, in the directory of
    # template_tools_packer_bin.
    - name: Install the Packer binary from the checksum-verified release
      ansible.builtin.unarchive:
        src: "{{ template_tools_packer_download }}"
        dest: "{{ template_tools_packer_bin | dirname }}"
        include: [packer]
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Create the Packer license directory
      ansible.builtin.file:
        path: "{{ template_tools_packer_license_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the Packer license beside the binary
      ansible.builtin.unarchive:
        src: "{{ template_tools_packer_download }}"
        dest: "{{ template_tools_packer_license_dir }}"
        include: [LICENSE.txt]
        remote_src: true
        owner: root
        group: root
        mode: '0644'
