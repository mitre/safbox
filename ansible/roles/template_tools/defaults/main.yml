---
# template_tools role: the assessment and build tools a SAFBox ships: CINC Auditor,
# the SAF CLI, Ansible with the collections the Lockdown STIG role needs,
# and Packer. Pins live in group_vars/all/main.yml and are overridable per
# site. Task groups are tagged safbox-tools-<name> and switched off by
# setting safbox_tools_<name> to false; Ansible has no switch.

# SAF CLI: installed from files/saf-cli/package-lock.json into its own
# directory, with the saf command linked onto the default PATH. npm's
# cache goes in /var/tmp, which the seal clears.
template_tools_saf_cli_prefix: /usr/local/lib/saf-cli
template_tools_saf_cli_bin: /usr/local/bin/saf
template_tools_saf_cli_npm_cache: /var/tmp/safbox-npm-cache

# Ansible collections go in the system-wide collection path every user's
# ansible-core searches by default.
template_tools_ansible_collections_path: /usr/share/ansible/collections
# ansible-galaxy's API cache during the install, in /var/tmp so the seal
# clears it.
template_tools_ansible_galaxy_cache: /var/tmp/safbox-galaxy-cache

# Packer: the unmodified binary, and its license text beside it (the
# Business Source License asks that it accompany every copy).
template_tools_packer_bin: /usr/local/bin/packer
template_tools_packer_license_dir: /usr/local/share/licenses/packer
