---
# Handlers run in this order: the status directory exists before the proxy,
# which mounts it, restarts.
- name: Create the status directory
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/safbox-landing.conf
  changed_when: true

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Only on a deployed box (its certificate exists); at build nothing runs.
- name: Restart the proxy
  ansible.builtin.systemd_service:
    name: safbox-proxy.service
    state: restarted
  when: proxy_tls.stat.exists | default(false)
