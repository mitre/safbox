---
# SAFBox's deviations from the RHEL 10 STIG (ADR-0001 §Decision: hardened
# with documented deviations). One list, consumed by both sides:
#   - the hardening role switches each rule off through the Lockdown role's
#     per-rule variable, rhel10stig_<digits of stig_id>;
#   - the STIG overlay (verify/safbox-rhel10-stig-overlay/controls/overlay.rb)
#     marks each vuln_id Not Applicable (impact 0.0) with this justification.
# scripts/deviations-check.sh fails the build if the two differ, and
# scripts/deviations-doc.sh generates docs/deviations.md from this file.
#
# Every entry is an owner decision. reason is one of:
#   usability       deliberately relaxed for the non-expert audience
#   content-defect  an upstream role or profile bug; issue links the report,
#                   and the entry is retired when the fix is pinned
#   deploy-time     only the deploying environment can satisfy it
# The first usability entry is the account lockout requirement.
#
# A site that decides differently removes an entry here and the matching
# override from the overlay, or sets the Lockdown variable in
# ansible/local.yml and supplies its own threshold (docs/rebuild.md).
hardening_deviations:
  - vuln_id: SV-280935
    stig_id: RHEL-10-000510
    title: Encrypt all local disk partitions that require at-rest protection
    reason: deploy-time
    justification: >-
      SAFBox is distributed as a virtual machine template and cannot encrypt
      its own disks. Any key that let the template boot unattended would be
      shared by every copy, so SAFBox does not presently provide encryption
      within the VM itself. Data at rest encryption should be implemented by
      the hypervisor or storage layer of the deploying environment.

  - vuln_id: SV-281197
    stig_id: RHEL-10-600425
    title: Maintain an account lock until an administrator releases it
    reason: usability
    justification: >-
      SAFBox is an appliance for operators who may be its only administrator.
      A lock that only an administrator can release can leave nobody able to
      log in. Where pam_faillock locks an account, the lock instead expires
      after the pam_faillock default of 10 minutes.

  - vuln_id: SV-281195
    stig_id: RHEL-10-600415
    title: Lock the root account until an administrator releases it after three failed logons
    reason: usability
    justification: >-
      Root is the recovery account of last resort on the console of a SAFBox
      that may have a single operator. Locking it until an administrator
      releases it can leave the appliance unrecoverable without a rebuild.

  - vuln_id: SV-281169
    stig_id: RHEL-10-600100
    title: 60-day maximum password lifetime for new users in /etc/login.defs
    reason: usability
    justification: >-
      SAFBox deploy accounts are created at first boot, log in with an SSH key
      and have no password. Tested: once such an account's password passed
      the 60-day maximum age, its key login was refused because a password
      change was required that a locked password cannot make.

  - vuln_id: SV-281175
    stig_id: RHEL-10-600160
    title: Disable accounts after 35 days of inactivity
    reason: usability
    justification: >-
      SAFBox deploy accounts log in with an SSH key and have no password to
      keep active. Tested: 35 days after such an account's password expired,
      PAM disabled the account and refused its key login.

  - vuln_id: SV-281103
    stig_id: RHEL-10-500035
    title: Panic the system on a critical audit processing failure
    reason: usability
    justification: >-
      A panic on an audit processing failure would halt SAFBox and take its
      services down. SAFBox rotates its audit logs instead
      (max_log_file_action = ROTATE) and reports audit failures to the
      kernel log.

  - vuln_id: SV-280970
    stig_id: RHEL-10-200601
    title: Enable the fapolicy module (application allow-listing)
    reason: usability
    justification: >-
      SAFBox is an automation runner: its accounts run the InSpec profiles
      and Ansible playbooks they bring. fapolicyd judges the program that
      opens a file, and for InSpec, Ansible and Node.js packages an account
      installs, that program is an interpreter (CINC Auditor's Ruby, Python,
      Node.js), so it cannot allow a tool without allowing its interpreter
      to run any code; a rule on the process name is met by any link given
      that name. Tested with fapolicyd enforcing, as an account other than
      root: an InSpec profile with Ruby libraries, a playbook with its own
      module or filter plugin, a collection in the account's home, a Python
      virtual environment and an npm package were all refused, as were cp
      and git checkout of Ruby files. /home, /tmp, /var/tmp and /dev/shm are
      mounted noexec, so programs placed there cannot be run directly; that
      does not stop interpreters or rootless containers running code an
      account supplies, which is what a runner is for. fapolicyd stays
      installed (RHEL-10-200600) and is not enabled.

  - vuln_id: SV-280971
    stig_id: RHEL-10-200602
    title: Employ a deny-all, permit-by-exception fapolicy policy
    reason: usability
    justification: >-
      The policy takes effect only while fapolicyd runs, and SAFBox does not
      enable fapolicyd (SV-280970, same reasoning). Its rules are left as
      the package installs them.

  - vuln_id: SV-280985
    stig_id: RHEL-10-200642
    title: Forward audit records via TCP to a different system via rsyslog
    reason: deploy-time
    site_setting: remote_log_server
    justification: >-
      The remote log server is the deploying site's. SAFBox forwards no logs
      until a site names its server (safbox_remote_log_server); the rule is
      then applied and this control evaluated.

  - vuln_id: SV-280987
    stig_id: RHEL-10-200644
    title: Authenticate the remote logging server for off-loading audit logs via rsyslog
    reason: deploy-time
    justification: >-
      Remote log offload is provided by the deploying site's log server.
      SAFBox ships without one to authenticate.

  - vuln_id: SV-280988
    stig_id: RHEL-10-200645
    title: Encrypt audit records off-loaded via rsyslog
    reason: deploy-time
    justification: >-
      Remote log offload is provided by the deploying site's log server.
      SAFBox ships without one to send encrypted records to.

  - vuln_id: SV-281338
    stig_id: RHEL-10-800060
    title: At least two name servers configured
    reason: deploy-time
    justification: >-
      Name servers are provided by the deploying site's network, through
      DHCP or cloud-init.

  - vuln_id: SV-281325
    stig_id: RHEL-10-701230
    title: Certificate status checking for multifactor authentication
    reason: deploy-time
    justification: >-
      PKI-based multifactor authentication is provided by the deploying
      site's PKI and identity service. SAFBox ships without one.

  - vuln_id: SV-281329
    stig_id: RHEL-10-701270
    title: Validate PKI certificates by constructing a certification path to an accepted trust anchor
    reason: deploy-time
    justification: >-
      The trust anchors for PKI-based authentication are provided by the
      deploying site's PKI. SAFBox ships without one.

  - vuln_id: SV-281330
    stig_id: RHEL-10-701280
    title: Map the authenticated PKI identity to a user or group account
    reason: deploy-time
    justification: >-
      The mapping of PKI identities to accounts is provided by the deploying
      site's identity service. SAFBox ships without one.

  - vuln_id: SV-281166
    stig_id: RHEL-10-600000
    title: Require a boot loader superuser password
    reason: deploy-time
    justification: >-
      A boot loader password baked into the template would be shared by
      every copy. The deploying site sets it (grub2-setpassword).

  - vuln_id: SV-281167
    stig_id: RHEL-10-600010
    title: Require a unique boot loader superuser name
    reason: deploy-time
    justification: >-
      The boot loader superuser and its password are set by the deploying
      site, so that no copy of the template shares them.
