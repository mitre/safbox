---
# clone_accounts role of the first-boot play: admin (task group
# safbox-base-6, tasks/admin.yml) and safuser (safbox-base-5,
# tasks/safuser.yml).

# admin: AccountsService's per-user files, where it is hidden from the
# login screen, and the service that reads them.
clone_accounts_admin_accounts_dir: /var/lib/AccountsService/users
clone_accounts_admin_accounts_service: accounts-daemon.service

# safuser: its name and GECOS comment; the root-only file that keeps a
# generated password (SAFUSER_PASSWORD=); its sudo rule, which asks for its
# password; the PAM file whose pam_unix rounds= the password is hashed
# with; and how many passwords to try (pwmake, then pwscore) before giving
# up on one that meets the password quality policy. pwmake fails about 1
# call in 22 under the STIG policy, so 50 makes giving up practically
# impossible.
clone_accounts_safuser_name: safuser
clone_accounts_safuser_comment: SAFBox tools user
clone_accounts_safuser_env_file: "{{ safbox_etc_dir }}/safuser.env"
clone_accounts_safuser_sudoers_file: /etc/sudoers.d/50-safuser
clone_accounts_safuser_pam_password_file: /etc/pam.d/system-auth
clone_accounts_safuser_generate_attempts: 50

# clone_accounts_cloud_config, when set (for testing), stands in for
# cloud-init's combined configuration (user, system_info,
# ssh_authorized_keys, password); without it the role reads it with
# cloud-init query combined_cloud_config.
