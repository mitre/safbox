---
# Debian family names, so the appliance layer can run on a Debian family
# host; untested until the Ubuntu source lands.
seal_package_cache_clean_argv: [apt-get, clean]
seal_proxy_ca_anchor: /usr/local/share/ca-certificates/local-ca-safbox-proxy.crt
seal_trust_update_argv: [update-ca-certificates, --fresh]
seal_installer_residue_find:
  paths: [/root]
  patterns: ['autoinstall-user-data']
seal_installer_residue_paths:
  - /var/log/installer
seal_network_profiles_find:
  paths: [/etc/netplan]
  patterns: ['00-installer-config*.yaml']
seal_glibc_package: libc6
# amd64 packages target the x86-64 baseline.
seal_x86_64_baseline_level: {}
