---
# Golden-image reset by cloud-init itself: instance state, logs, seed,
# machine-id (set to "uninitialized" so systemd generates a new one on the
# clone's first boot) and the network configuration it generated.
- name: Reset cloud-init and the machine identity so a clone runs as a new instance
  ansible.builtin.command:
    argv: [cloud-init, clean, --logs, --seed, --machine-id, --configs, network]
  changed_when: true

- name: Remove files cloud-init wrote for the build VM's own instance
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ seal_cloud_init_instance_files }}"

- name: Find first-boot env files that must not exist in a template
  ansible.builtin.find:
    paths: "{{ seal_env_file_dir }}"
    patterns: "{{ seal_env_file_pattern }}"
    file_type: file
  register: seal_env_files

- name: Remove first-boot state and env files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ seal_firstboot_state + (seal_env_files.files | map(attribute='path') | list) }}"

- name: Find network profiles bound to the build VM
  ansible.builtin.find:
    paths: "{{ seal_network_profiles_find.paths }}"
    patterns: "{{ seal_network_profiles_find.patterns }}"
    file_type: file
  register: seal_network_profiles

# Deleting the keyfile does not take down the active connection; the build
# keeps its network until shutdown.
- name: Remove network profiles bound to the build VM
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ seal_network_profiles.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find shell history files
  ansible.builtin.find:
    paths:
      - /root
      - /home
    patterns:
      - '.bash_history'
      - '.sh_history'
      - '.zsh_history'
      - '.python_history'
      - '.lesshst'
    hidden: true
    recurse: true
    depth: 2
    file_type: file
  register: seal_history_files

- name: Remove shell history files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ seal_history_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find temporary files left by the build
  ansible.builtin.find:
    paths:
      - /tmp
      - /var/tmp
    excludes:
      - 'systemd-private-*'
    file_type: any
    hidden: true
  register: seal_tmp_entries

- name: Remove temporary files left by the build
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ seal_tmp_entries.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Clean the package manager cache
  ansible.builtin.command:
    argv: "{{ seal_package_cache_clean_argv }}"
  changed_when: true

- name: Find installer residue
  ansible.builtin.find:
    paths: "{{ seal_installer_residue_find.paths }}"
    patterns: "{{ seal_installer_residue_find.patterns }}"
    file_type: file
  register: seal_installer_files

- name: Remove installer residue
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (seal_installer_files.files | map(attribute='path') | list) + seal_installer_residue_paths }}"
