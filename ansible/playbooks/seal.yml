---
# Seal the image: record the build, strip instance identity and build
# residue, delete the build user, and assert the result (the final script
# checks its own post-conditions). The last step of a
# build; afterwards the build user no longer exists, so nothing may run over
# SSH as that user. -e template_seal_mode=development stops before deleting the build
# user, host keys and logs (see the template_seal role defaults).
# Destructive: never run it against a host you intend to keep using.
#   ansible-playbook playbooks/seal.yml -e template_seal_git_commit="$(git rev-parse HEAD)"
- name: Seal the SAFBox image
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - role: template_seal
