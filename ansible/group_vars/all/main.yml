---
# Project-wide variables for the SAFBox appliance layer, applied to every
# host the playbooks touch. One file, sectioned. Role-level knobs with
# sensible defaults live in each role's defaults/main.yml; this file is where
# the project overrides them and where every version pin lives
# (ADR-0001 Quality Standards: pinned inputs). Later phases add their pins
# here when they first use them; nothing is pinned ahead of use.
#
# Precedence reminder: role defaults < this file < play vars < -e extra vars.

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

# The account the install layer creates for the build (the kickstart's
# build_user). The seal step deletes it with its key and sudo drop-in, and
# asserts it is gone; the validation profile checks it on clones.
safbox_build_user: packer

# Default accounts distribution cloud images create (system_info.default_user
# in cloud.cfg, or the image vendor's own). The kickstart stops cloud-init
# creating one (users: [] in cloud.cfg.d); the validation profile asserts
# none exists.
safbox_distro_default_users:
  - cloud-user
  - almalinux
  - rocky
  - ubuntu
  - debian

# Install a trivial Quadlet unit that proves the container runtime starts a
# unit on boot (Phase 2 acceptance). The acceptance build sets it true; the
# validation profile checks the unit whenever it is installed.
safbox_example_quadlet_enabled: false

# ---------------------------------------------------------------------------
# Task group switches
# ---------------------------------------------------------------------------
# Every task group in the appliance roles is a block tagged
# safbox-<role>-<n> and runs only while its switch below is true, in the
# style of Ansible Lockdown. Turn a group off here or in ansible/local.yml;
# run or skip groups for one invocation with --tags / --skip-tags. The seal
# role is tagged but not switchable: it runs whole or not at all.

# platform
safbox_platform_1: true   # base packages and services
safbox_platform_2: true   # SELinux enforcing assertion
safbox_platform_3: true   # firewall allows the base services
safbox_platform_4: true   # container runtime (podman, Quadlet, registry policy)
safbox_platform_5: true   # smoke-test container (also needs safbox_example_quadlet_enabled)
safbox_platform_6: true   # persistent journal

# site_config
safbox_site_config_1: true  # site CA bundles in the system trust store (safbox_trust_bundles, DoD by default)

# base
safbox_base_1: true  # first-boot framework
safbox_base_2: true  # the safbox command

# tools
safbox_tools_1: true      # CINC Auditor
safbox_tools_2: true      # SAF CLI on the distribution's Node.js
safbox_tools_3: true      # Ansible (ansible-core) and the Lockdown STIG collections
safbox_tools_4: true      # HashiCorp Packer (BSL 1.1; distributors may switch it off, see docs/third-party.md)

# services (each long-running service is one group; the proxy fronts the
# applications whose groups are on)
safbox_services_1: true   # Heimdall and its PostgreSQL as a Quadlet pod, secrets from first boot
safbox_services_2: true   # Vulcan and its PostgreSQL as a Quadlet pod, secrets from first boot
safbox_services_3: true   # nginx TLS proxy for the enabled applications, certificate from first boot

# hardening (the last role; ADR-0001 §Decision: hardened with documented
# deviations). Which STIG rules it applies is set by the Lockdown role's own
# variables (rhel10stig_*) and the deviations file; see docs/deviations.md.
safbox_hardening_1: true  # apply the RHEL 10 STIG with the pinned Ansible Lockdown role

# ---------------------------------------------------------------------------
# Site CA bundles
# ---------------------------------------------------------------------------
# CA bundles the site_config role installs in the system trust store (task
# group safbox-site-config-1), which the host and the Heimdall and Vulcan
# containers then trust. The DoD PKI bundle by default (owner decision,
# 2026-10-16): every build downloads it from dl.dod.cyber.mil. Set the list
# to [] in ansible/local.yml to build without it, or give the pinned file as
# a local path on a network without that host (docs/rebuild.md "Site CA
# bundles"). Each entry is a mapping:
#   name     lowercase letters, digits and hyphens; names the anchor files
#   url      fetched by the box (https://...), or
#   path     a file on the machine running Ansible (absolute path)
#   sha256   of the downloaded or local file; a mismatch fails the run
#   format   pem, der, pkcs7-der or pkcs7-pem (what the file, or the
#            archive member, holds)
#   member   for a zip archive, the file inside it in that format (a
#            relative path, without ..)
# A pinned bundle is enabled by naming its pin. Set your own list in
# ansible/local.yml; see docs/rebuild.md "Site CA bundles".
safbox_trust_bundles:
  - "{{ safbox_trust_bundle_dod }}"

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
# Each application's pod publishes its port on the host's loopback address
# only; the TLS proxy (nginx on the host network) serves it to the network
# on the application's HTTPS port, and the firewall opens exactly those
# ports. 443 is reserved for the landing page (ADR-0001 Phase 8). Both
# applications listen on 3000 inside their pods (upstream); Vulcan's
# loopback port is 3001, the port its compose file documents for running
# beside another service on 3000. The validation profile's proxy_ports and
# loopback_ports inputs default to these values (tests/ansible/pins.sh).
safbox_heimdall_loopback_port: 3000
safbox_heimdall_https_port: 8443
safbox_vulcan_loopback_port: 3001
safbox_vulcan_https_port: 9443

# The firewalld zone the box ends up in. Hardening moves the interface into
# Lockdown's zone and makes it the default (drop: only ssh, dns and ntp are
# allowed), so the proxy opens its ports in that same zone; without
# hardening the distribution default (public) stays.
safbox_firewall_zone: "{{ 'drop' if safbox_hardening_1 | bool else 'public' }}"

# ---------------------------------------------------------------------------
# Ansible Lockdown RHEL10-STIG role variables
# ---------------------------------------------------------------------------
# The Lockdown role's defaults apply except where set here. These are not
# STIG rules: rule switches (rhel10stig_<n>) are set only from the hardening
# role's deviations.yml and not_applied.yml (docs/deviations.md).

# The role's local fact file records its run time, so it is rewritten on
# every run and a second run is never clean. The hardening role writes its
# own record of what was applied instead (/usr/local/share/safbox/hardening).
create_benchmark_facts: false

# Lockdown's firewalld zone is the box's zone (safbox_firewall_zone above).
rhel10stig_custom_firewall_zone: "{{ safbox_firewall_zone }}"

# Login banner shown before local and SSH logins (/etc/issue, which sshd's
# Banner names). A SAFBox placeholder, not the DoD notice: a site replaces it
# with its own notice in ansible/local.yml, and sets the same text for the
# STIG overlay's banner_message_text_* inputs in its site inputs file
# (tests/verify/overlay.sh checks the tracked pair agree).
safbox_logon_banner: >-
  SAFBox security appliance. Authorized use only. Activity on this system may
  be monitored and recorded.
rhel10stig_logon_banner_nice: "{{ safbox_logon_banner }}"

# Remote log server for audit records (RHEL-10-200642, SV-280985). Empty by
# default: SAFBox forwards no logs, the hardening role switches the rule off
# and the STIG overlay marks SV-280985 Not Applicable (a deploy-time
# deviation, docs/deviations.md). A site names its server here in
# ansible/local.yml, and sets the overlay input remote_log_server to the same
# value in its site inputs file; the rule is then applied with these values
# and the control evaluated. Lockdown writes /etc/rsyslog.d/99-forwarding.conf
# (rsyslog omfwd), whose protocol is tcp or udp.
safbox_remote_log_server: ""
safbox_remote_log_port: 514
safbox_remote_log_protocol: tcp
rhel10stig_rsyslog_remote_server_ip: "{{ safbox_remote_log_server }}"
rhel10stig_rsyslog_remote_server_port: "{{ safbox_remote_log_port }}"
rhel10stig_rsyslog_remote_server_protocol: "{{ safbox_remote_log_protocol }}"

# ---------------------------------------------------------------------------
# Pins: container images
# ---------------------------------------------------------------------------
# Images are pinned by digest so a retagged upstream image cannot change what
# we ship. The human-readable tag is recorded alongside for review; roles
# MUST use the digest form (name@sha256:...). The digest is that of the
# multi-architecture index, as returned in the Docker-Content-Digest header:
#   curl -sI -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
#     https://<registry>/v2/<name>/manifests/<tag>

# Container runtime smoke test image (Phase 2).
safbox_image_pause:
  name: registry.k8s.io/pause
  tag: 3.10.2
  digest: sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4

# Service images. Each is the image the upstream compose file names, at an
# exact release, unless noted. The validation profile's service_images input
# lists the same name@digest references (tests/ansible/pins.sh fails on
# drift). Bump deliberately, reviewing the Quadlet unit against the new
# upstream compose file (ADR-0001 Risks: upstream images change shape).

# Heimdall (mitre/heimdall2 docker-compose.yml: server, mitre/heimdall2:
# release-latest, which is 2.14.0).
safbox_image_heimdall:
  name: docker.io/mitre/heimdall2
  tag: 2.14.0
  digest: sha256:06f6e72d416a71e8939da341f78681891aa531765a9d4c62dcc224d3044d0347

# Heimdall's database (heimdall2 compose: database, postgres:17).
safbox_image_heimdall_db:
  name: docker.io/library/postgres
  tag: '17.11'
  digest: sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3

# Vulcan (mitre/vulcan docker-compose.yml: web; its compose builds the image,
# so this is the published release image, mitre/vulcan:release-latest, which
# is 2.4.1).
safbox_image_vulcan:
  name: docker.io/mitre/vulcan
  tag: 2.4.1
  digest: sha256:f2087e590a48c921542bf403aba7238ba0a4d1e0b81f16d844fab4c70eac135e

# Vulcan's database (vulcan compose: db, postgres:18-alpine).
safbox_image_vulcan_db:
  name: docker.io/library/postgres
  tag: 18.6-alpine
  digest: sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

# The TLS proxy. Both upstream compose files use nginx:alpine, whose OpenSSL
# has no FIPS provider. Red Hat's UBI 9 nginx image links the image's
# OpenSSL, which runs its FIPS provider on a FIPS host and follows the FIPS
# system crypto policy podman maps into the container (ADR-0001 Reverse
# proxy: nginx chosen for its FIPS path). UBI 9, not UBI 10: UBI 10 images
# need an x86-64-v3 CPU, and the development base runs on x86-64-v2.
safbox_image_proxy:
  name: registry.access.redhat.com/ubi9/nginx-126
  tag: 9.8-1791881018
  digest: sha256:ede0e7a8623c1d6a7db313b4b8e7a4bfcc86cbdd47f2d62798d50aba86066cdc

# ---------------------------------------------------------------------------
# Pins: CA bundles
# ---------------------------------------------------------------------------
# The DoD PKI CA bundle from DISA's public PKI library (the DoD Cyber
# Exchange download site): a stable URL whose content DISA replaces with
# each release, pinned by the sha256 of release 5.14 as served on
# 2026-10-15 (Last-Modified 2026-04-28). The library's index page now sits
# behind a sign-in, so the URL is pinned rather than scraped from it. When
# DISA publishes a new release the download no longer matches and the run
# fails, until the pin is updated deliberately: download the zip, check the
# signed manifest inside it as its README describes (openssl smime -verify
# against DoD_PKE_CA_chain.pem, whose root's fingerprint matches the one
# published at https://crl.disa.mil), then set version, sha256 and member
# here and the root fingerprints of the profile's trust_bundle_anchors
# input. The member is the DER PKCS#7 of every DoD root and issuing CA
# (49 certificates: DoD Root CA 3, 4, 5 and 6 and their subordinates).
# Trusted while listed in safbox_trust_bundles, as it is by default.
safbox_trust_bundle_dod:
  name: dod
  version: '5.14'
  url: https://dl.dod.cyber.mil/wp-content/uploads/pki-pke/zip/unclass-certificates_pkcs7_DoD.zip
  sha256: 32595adbe752df5823cedd2c6a4f206c07fcc3c1520fb831015204e9fbb75711
  format: pkcs7-der
  member: Certificates_PKCS7_v5_14_DoD/Certificates_PKCS7_v5_14_DoD.der.p7b

# ---------------------------------------------------------------------------
# Pins: downloaded tools
# ---------------------------------------------------------------------------
# Anything fetched by URL is pinned by version AND sha256 of the artifact;
# tasks pass the checksum to get_url so a changed upstream file fails the
# build instead of installing silently. Checksums are those published in the
# vendor's metadata (CINC: https://omnitruck.cinc.sh/stable/<product>/metadata)
# and were verified against a download.

# CINC Auditor ships on the box as an assessment tool (the tools role). This
# is the RHEL 10 family build. Hosts with unusual needs (for example a CPU
# older than the x86-64-v3 level RHEL 10 builds assume) override the whole
# entry in a local vars file; see docs/rebuild.md "Site overrides".
safbox_tool_cinc_auditor:
  version: 7.2.1
  release: 1.el10
  url: https://packages.cinc.sh/files/stable/cinc-auditor/7.2.1/el/10/cinc-auditor-7.2.1-1.el10.x86_64.rpm
  sha256: cd83f06159efdb05686457644926cbe976e9023730ec90fe9f21fb1530e25f2d

# The SAF CLI (tools group 2), installed from the npm registry and run by
# the distribution's Node.js so its crypto is the system OpenSSL. Pinned at
# the root dependency: this version is exact and npm resolves the SAF CLI's
# own dependencies at build time (ADR-0001 Quality Standards).
safbox_tool_saf_cli:
  version: 1.7.0

# ansible-core from the distribution (tools group 3), so it runs on the
# system Python and OpenSSL. The version is the upstream ansible-core
# version the distribution package carries; the build fails if the
# distribution no longer offers it. The Lockdown RHEL10-STIG role needs
# ansible-core 2.16.1 or newer.
safbox_tool_ansible_core:
  version: 2.16.16

# Collections the Ansible Lockdown RHEL10-STIG role requires (its
# collections/requirements.yml at tag 1.1.0: community.general,
# community.crypto, ansible.posix), installed from Galaxy system-wide for the
# on-box ansible-core. Each is the newest release whose requires_ansible
# admits the ansible-core pinned above. Pinned at the root: the version is
# exact and Galaxy resolves dependencies (none declares any today).
safbox_tool_ansible_collections:
  - name: ansible.posix
    version: 2.2.2
  - name: community.crypto
    version: 2.26.9
  - name: community.general
    version: 11.4.9

# ---------------------------------------------------------------------------
# Pins: hardening content
# ---------------------------------------------------------------------------
# The Ansible Lockdown RHEL 10 STIG role (hardening group 1), installed on the
# build runner from ansible/requirements.yml by the commit its release tag
# names; tests/ansible/pins.sh fails if the two differ. The hardening role
# refuses to run any other installed version. Release 1.1.0 targets the
# RHEL 10 STIG V1R1, as does the MITRE baseline the STIG overlay pins
# (verify/safbox-rhel10-stig-overlay); both cover the same 434 requirements.
# The role needs ansible-core 2.16.1 or newer on the build runner.
safbox_hardening_lockdown:
  name: RHEL10-STIG
  src: https://github.com/ansible-lockdown/RHEL10-STIG.git
  version: 1.1.0
  commit: db177ced50f33a42d1ebbfafa86eb02733665602
  benchmark: v1r1

# HashiCorp Packer (tools group 4), the release zip for linux/amd64. The
# checksum is the one in packer_<version>_SHA256SUMS, whose detached
# signature verifies against HashiCorp's release key, and was verified
# against a download. Packer is under the Business Source License 1.1; see
# docs/third-party.md before redistributing an image with this group on.
safbox_tool_packer:
  version: 1.16.1
  url: https://releases.hashicorp.com/packer/1.16.1/packer_1.16.1_linux_amd64.zip
  sha256: af38a9e93e4ed1b9ca68206ae969c64c300c82a3dde46a780dfa629f0867f651
