---
# Known content defects in the pinned MITRE RHEL 10 STIG baseline that are
# NOT deviations: the control stays in force, its result (right or wrong) is
# locked in verify/thresholds/ as it is, and nothing here changes the scan.
# Recorded so docs/deviations.md can explain those results. An entry becomes
# a content-defect deviation (ansible/roles/hardening/vars/deviations.yml
# plus an overlay override) only when the owner decides so and the upstream
# issue exists; it is then removed here. scripts/deviations-check.sh checks
# the format and that no entry is overridden in the overlay.
#
# Each entry: vuln_id, result (what the scan reports), defect, and issue
# (the upstream report, once filed).
known_defects:
  - vuln_id: SV-281009
    result: fails
    defect: >-
      Checks FIPS mode with fips-mode-setup --check, which RHEL 10 removed.
      SAFBox is in FIPS mode from installation (fips_enabled is 1, asserted
      by the build and by safbox-fips-1). Never deviated.
    issue: https://github.com/mitre/redhat-enterprise-linux-10-stig-baseline/issues/6

  - vuln_id: SV-281332
    result: fails
    defect: >-
      Passes the zone label "drop (default)" unquoted to firewall-cmd --zone,
      which bash rejects, so the zone's ports, protocols and services are
      never evaluated.

  - vuln_id: SV-281333
    result: fails
    defect: As for SV-281332.

  - vuln_id: SV-281001
    result: fails
    defect: >-
      Treats the virtual machine as a container ("OpenSSH Server is installed
      but not approved for the container environment").

  - vuln_id: SV-281296
    result: fails
    defect: As for SV-281001.

  - vuln_id: SV-281036
    result: passes
    defect: >-
      Calls input('var_log_messages_group') inside the matcher block, where
      it resolves no value even though the input is declared with a default
      (or set in an inputs file), and the comparison then passes whatever the
      group owner is. Setting the input does not help.

  - vuln_id: SV-281224
    result: fails
    defect: >-
      Reads Banner through the sshd_config resource, which does not follow
      the Include of /etc/ssh/sshd_config.d/, so the Banner the hardening
      sets there is reported as not set.
