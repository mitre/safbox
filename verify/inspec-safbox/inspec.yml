name: inspec-safbox
title: SAFBox appliance validation
maintainer: MITRE SAF
copyright: The MITRE Corporation
copyright_email: saf@mitre.org
license: Apache-2.0
summary: >-
  Root wrapper for SAFBox validation (ADR-0001 §Validation stages). One
  scan of this profile is the build-time gate and the release gate: it
  includes every child profile, and each child declares the platforms it
  supports, so a child that does not match the target is skipped. Today
  the children are the RHEL 10 family's infrastructure controls and its
  STIG overlay; a later OS family adds its own pair here. The wrapper
  declares no platform support, controls or inputs of its own; inputs
  belong to the child that reads them and reach it from --input-file.
version: 0.5.0
inspec_version: ">= 5.0"
depends:
  - name: el10-infrastructure
    path: ../el10-infrastructure
  - name: safbox-rhel10-stig-overlay
    path: ../safbox-rhel10-stig-overlay
