---
name: inspec-safbox
title: SAFBox appliance validation
maintainer: MITRE SAF
copyright: The MITRE Corporation
copyright_email: saf@mitre.org
license: Apache-2.0
summary: >-
  Asserts that a SAFBox image or clone carries the appliance foundation
  (ADR-0001 Phase 2): FIPS mode, Secure Boot, the expected OS family,
  enabled units, the guest agent's RPC filter, podman and Quadlet, the
  safbox CLI, the first-boot framework, no distribution default user and,
  once sealed, the build record and the absence of build residue. Runs from
  the build runner over SSH; the sealed template's own invariants are
  asserted by the seal step itself.
version: 0.3.0
inspec_version: ">= 5.0"
supports:
  - platform-family: redhat
  - platform-family: debian
inputs:
  - name: build_info_expected
    description: >-
      True on a clone of a sealed template: asserts the build record exists
      and that the build user and installer residue are gone. The build's
      own check, which runs before the seal, sets it false.
    type: Boolean
    value: true
  - name: seal_mode_expected
    description: >-
      Seal mode the build record must name. full on a release template's
      clone, so the release gate rejects a development (unsealed) template;
      set development to check a clone of one.
    type: String
    value: full
  - name: guest_agent_expected
    description: >-
      True where the hypervisor provides a guest-agent channel, so the agent
      must be running. Set false on platforms that have none.
    type: Boolean
    value: true
  - name: firstboot_completed_expected
    description: True on a deployed clone whose first boot has finished.
    type: Boolean
    value: false
  - name: fips_required
    description: FIPS mode is an image property on the RHEL family (ADR-0001).
    type: Boolean
    value: true
  - name: secure_boot_required
    description: The image boots with UEFI Secure Boot enforced.
    type: Boolean
    value: true
  - name: expected_platform_id
    description: PLATFORM_ID the RHEL family image must report.
    type: String
    value: platform:el10
  - name: build_user
    description: >-
      The account the install layer creates for the build; the seal step
      deletes it.
    type: String
    value: packer
  - name: distro_default_users
    description: >-
      Default accounts distribution cloud images create. None may exist on a
      SAFBox; the default_user name in the cloud-init configuration is
      checked as well.
    type: Array
    value:
      - cloud-user
      - almalinux
      - rocky
      - ubuntu
      - debian
  - name: guest_agent_denied_rpcs
    description: >-
      Guest agent commands that give the hypervisor administrator command
      execution or file access inside the guest. The distribution default
      filter must keep every one of them disabled.
    type: Array
    value:
      - guest-exec
      - guest-exec-status
      - guest-file-open
      - guest-file-close
      - guest-file-read
      - guest-file-write
      - guest-file-seek
      - guest-file-flush
