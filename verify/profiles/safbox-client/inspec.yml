---
name: safbox-client
title: SAFBox from a client
maintainer: MITRE SAF
copyright: The MITRE Corporation
copyright_email: saf@mitre.org
license: Apache-2.0
summary: >-
  Checks a deployed SAFBox the way another machine on its network sees it:
  the TLS proxy's protocols and certificate, that only the proxy's ports
  answer, and that Heimdall, Vulcan and Keycloak each answer through it.
  Runs on this machine (-t local), never on the box: checks that need a
  shell on the box are in the safbox profile. It only reads: it signs in
  to nothing and changes nothing on the box.
version: 1.0.0
inspec_version: ">= 5.0"
# This machine, a Linux workstation with OpenSSL 3 and nc or ncat.
supports:
  - platform-family: linux
inputs:
  - name: address
    description: >-
      The box's address. Requests for its names go there, with the name
      as the TLS server name or the HTTP Host header, as a DNS or hosts
      entry on a client would send them, so this machine needs neither.
    type: String
    required: true
  - name: domain
    description: >-
      The domain the TLS proxy serves (safbox_domain in group_vars), the
      same input as the safbox profile's: each application at
      <application>.<domain>.
    type: String
    value: safbox.internal
  - name: expected_services
    description: >-
      Services the image ships, the same input as the safbox profile's.
      Remove one a site switches off.
    type: Array
    value: [heimdall, vulcan, keycloak, proxy]
