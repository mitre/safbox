---
name: safbox
title: SAFBox appliance
maintainer: MITRE SAF
copyright: The MITRE Corporation
copyright_email: saf@mitre.org
license: Apache-2.0
summary: >-
  Checks that a SAFBox build VM or deployed clone is what it should be: the
  operating system, FIPS mode and Secure Boot, the accounts, the hardening
  record, the assessment tools at their pinned versions, Heimdall and
  Vulcan behind the TLS proxy, and, on a clone, a sealed template's
  clean state.
version: 1.0.0
inspec_version: ">= 5.0"
supports:
  - platform-family: redhat
    release: 10.*
inputs:
  - name: deployed
    description: >-
      True on a deployed clone of a sealed template, false on the build VM
      before the seal (verify/inputs/build.yml).
    type: Boolean
    value: true
  - name: desktop
    description: >-
      True for an image built with the desktop (safbox_desktop_enabled):
      GNOME and its login screen on the console. False, the default, for
      the headless image.
    type: Boolean
    value: false
  - name: admin_user
    description: >-
      admin, cloud-init's default user: the deployer's key-only account
      for deploying and automation, the one account with passwordless
      sudo. A site whose deployment names its cloud-init user otherwise
      sets that name here; empty for a box deployed without one.
    type: String
    value: admin
  - name: safuser
    description: >-
      True when first boot makes safuser (safbox_base_5 on, the default);
      false for an image built with that group switched off.
    type: Boolean
    value: true
  - name: usbguard
    description: >-
      True when the build enables usbguard: Ansible Lockdown's
      RHEL-10-200561 with its CAT II rules (rhel10stig_cat2 and
      rhel10stig_200561 on, the default, and safbox_hardening_1 on); false
      for an image built with any of them off.
    type: Boolean
    value: true
  - name: guest_agents
    description: >-
      The guest agents the image ships, keyed by the hypervisor each
      serves as systemd-detect-virt names it: each one's package and
      systemd unit, and how it is kept from running programs or touching
      files in the guest (patterns its running command line must or must
      not match, or settings an INI file must hold). The install layer
      installs them and describes them in its answer file's
      guest-agents.yml, which scripts/validate.sh passes to every scan;
      empty here, so a scan without it fails safbox-system-1.
    type: Hash
    value: {}
  - name: initramfs_drivers
    description: >-
      Storage drivers every installed kernel's initramfs must carry, so
      the image finds its root disk on each supported hypervisor's
      virtual disk controllers: SATA (ahci), NVMe, virtio and the
      paravirtual SCSI controller (vmw_pvscsi). The install layer's
      dracut drop-in /etc/dracut.conf.d/90-safbox-storage-drivers.conf
      adds them to the host-only initramfs and must name each one.
      Network drivers are not needed until the root filesystem is
      mounted, so they are not listed.
    type: Array
    value: [ahci, nvme, virtio_blk, virtio_scsi, vmw_pvscsi]
  - name: expected_tools
    description: Tools the image ships. Remove one a site switches off.
    type: Array
    value: [cinc-auditor, saf-cli, ansible, packer]
  - name: expected_services
    description: Services the image ships. Remove one a site switches off.
    type: Array
    value: [heimdall, vulcan, keycloak, proxy]
  - name: build_scans
    description: >-
      True when the template holds the build gate's scan results, which
      scripts/build.sh packages and first boot imports into Heimdall. False
      for a box built without them, such as one the playbooks were applied
      to directly.
    type: Boolean
    value: true
  - name: domain
    description: >-
      The domain the TLS proxy serves (safbox_domain in group_vars): the
      start page at the domain itself, each application at
      <application>.<domain>.
    type: String
    value: safbox.internal
  - name: trusted_roots
    description: >-
      Labels of CA certificates that must be in the system trust store. The
      DoD roots by default; [] for an image built without the DoD bundle.
    type: Array
    value: [DoD Root CA 3, DoD Root CA 4, DoD Root CA 5, DoD Root CA 6]
  # Versions pinned in ansible/group_vars/all/main.yml. A site that
  # overrides a pin sets the matching input.
  - name: cinc_auditor_version
    type: String
    value: 7.2.1
  - name: saf_cli_version
    type: String
    value: 1.7.0
  - name: ansible_core_version
    type: String
    value: 2.16.16
  - name: ansible_collections
    type: Hash
    value:
      ansible.posix: 2.2.2
      community.crypto: 2.26.9
      community.general: 11.4.9
  - name: packer_version
    type: String
    value: 1.16.1
  - name: lockdown_version
    type: String
    value: 1.1.0
