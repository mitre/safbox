---
# SAF CLI threshold for the FIPS exercise (verify/el10-fips-exercise)
# against a FIPS-mode build VM or clone of a repository-default image, with
# verify/inputs/fips-exercise.yml. Every list is an exact set.
#
# Each tool works under FIPS enforcement: its safbox-fips-exercise-<n>
# control passes. Whether its cryptography is the system OpenSSL FIPS
# provider is a low control, safbox-fips-provider-<n>: the SAF CLI (Node.js)
# and Ansible (Python) pass; CINC Auditor (embedded OpenSSL) and Packer (Go
# crypto) are known findings that fail, each tagged with its issue. A new
# finding, a finding that starts passing, or any other failure fails the
# gate, so every change to the documented state is a reviewed diff.
# tests/verify/onbox.sh fails if these lists differ from the profile.
passed:
  critical:
    controls:
      - safbox-fips-exercise-1
      - safbox-fips-exercise-2
      - safbox-fips-exercise-3
      - safbox-fips-exercise-4
  low:
    controls:
      - safbox-fips-provider-2
      - safbox-fips-provider-3
failed:
  critical:
    max: 0
  high:
    max: 0
  medium:
    max: 0
  low:
    controls:
      - safbox-fips-provider-1
      - safbox-fips-provider-4
error:
  total:
    max: 0
