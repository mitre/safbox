# SAF CLI threshold for the build-time gate (ADR-0001 §Validation stages):
# the verify/inspec-safbox wrapper scanned against the build VM after the
# appliance playbook and before the seal, with verify/inputs/build.yml.
#   packer/build.pkr.hcl -> scripts/validate.sh ... verify/thresholds/build.yml
# A site that changes what the image carries names a replacement through the
# Packer variable build_gate_site_threshold_file (docs/rebuild.md).
#
# Infrastructure (verify/el10-infrastructure, every control impact 1.0, the
# only controls in the critical bucket): exactly the controls a
# repository-default image passes here. The list is an exact set: a listed
# control that fails, skips or is missing, or an unlisted one that passes,
# fails the gate. Not listed: safbox-build-info-1, safbox-seal-1,
# safbox-seal-2 and safbox-firstboot-2, which need a sealed, deployed clone,
# and safbox-podman-2, which skips unless the build opts in to the
# smoke-test Quadlet unit. tests/verify/thresholds.sh fails if this list
# differs from the controls that apply.
#
# STIG (verify/safbox-rhel10-stig-overlay, never critical) before Phase 7: locked
# at the documented state. passed.<sev>.controls and failed.<sev>.controls
# (high, medium, low) list exactly which STIG controls pass and which fail
# in this context, as exact sets: any control that changes status fails the
# gate, including one control swapping for another. Known weaknesses stay
# visible as failures. To change the documented state on purpose, run
# scripts/lock-stig-threshold.sh on a results file and review the diff.
# STIG lists: generated 2026-10-14 by scripts/lock-stig-threshold.sh
# STIG lists: from a scan taken 20261013T013720Z
# STIG lists: high 15/10, medium 147/216, low 2/2 (passed/failed)
