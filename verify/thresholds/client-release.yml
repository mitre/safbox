---
# The safbox-client profile on a deployed clone, run from the runner
# (release gate). Six controls, all read-only requests: proxy-1 to -3 and
# one page check each for Heimdall, Vulcan and Keycloak. A switched-off
# service's controls are Not Applicable and do not count; nothing in the
# profile skips otherwise, so every control that applies must pass.
# Re-measured by reading the profile, not by a run.
failed:
  total:
    max: 0
skipped:
  total:
    max: 0
error:
  total:
    max: 0
