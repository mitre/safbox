---
name: safbox-rhel10-stig-overlay
title: SAFBox overlay for the RHEL 10 STIG
maintainer: MITRE SAF
copyright: The MITRE Corporation
copyright_email: saf@mitre.org
license: Apache-2.0
summary: >-
  The MITRE RHEL 10 STIG baseline with SAFBox's deviations applied
  (ADR-0001: hardening with documented deviations). Every baseline control
  runs; a deviation is marked and explained, never dropped.
version: 0.1.0
inspec_version: ">= 5.0"
supports:
  - platform-family: redhat
depends:
  # Pinned by commit; update deliberately and re-run the release gate.
  - name: redhat-enterprise-linux-10-stig-baseline
    git: https://github.com/mitre/redhat-enterprise-linux-10-stig-baseline
    ref: 49293f95b61f25c243b44365d8c16857db7f698c
inputs:
  # RHEL-10-000510 / SV-280935: data at rest is inherited from the
  # hypervisor or storage layer (see the caveat in controls/overlay.rb).
  - name: data_at_rest_exempt
    profile: redhat-enterprise-linux-10-stig-baseline
    value: true
