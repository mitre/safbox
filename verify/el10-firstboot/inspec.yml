---
name: el10-firstboot
title: SAFBox first-boot runner behaviour on the RHEL 10 family
maintainer: MITRE SAF
copyright: The MITRE Corporation
copyright_email: saf@mitre.org
license: Apache-2.0
summary: >-
  Exercises the installed first-boot runner and secrets library (ADR-0001
  §Decision: secrets are generated on first boot) against throwaway
  directory trees, never against /etc/safbox or /var/lib/safbox: the etc
  directory created root-owned 0700, hooks run in lexical order with
  non-executables skipped, completion recorded and a no-op rerun, no
  marker after a failing hook and a retry that keeps its secrets, and
  safbox_ensure_secret keeping an existing secret. Each control works in a
  scratch tree under /root that it removes, and asserts it is gone; the
  runner is called directly, so nothing reaches the journal. It writes
  files, so it runs alone through scripts/validate.sh, never in the
  release gate.
version: 0.1.0
inspec_version: ">= 5.0"
supports:
  - platform-family: redhat
    release: 10.*
inputs:
  - name: firstboot_runner
    description: The first-boot runner the base role installs.
    type: String
    value: /usr/local/sbin/safbox-firstboot
  - name: firstboot_lib_dir
    description: Directory of the secrets library (secrets.sh) the base role installs.
    type: String
    value: /usr/local/lib/safbox
