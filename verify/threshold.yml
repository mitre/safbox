---
# SAF CLI threshold for every validation run (ADR-0001: "Validation is the
# gate"), applied by scripts/validate.sh to the build's scan and to the
# release gate's scan of a clone.
#   saf validate threshold -i results.json -T verify/threshold.yml
#
# Phase 2 starts permissive: no critical or high control may fail; medium
# and low findings are reported but do not fail the build. Phase 7 tightens
# this once the STIG overlay lands.
#
# passed.total.min is a floor on how many controls must actually pass, so a
# run in which controls are silently skipped (an only_if gone wrong, a wrong
# input) fails instead of passing on what little ran. It is the build scan's
# count: controls for the build record and the finished first boot only
# apply to a clone. Raise it when controls are added.
passed:
  total:
    min: 17
failed:
  critical:
    max: 0
  high:
    max: 0
error:
  total:
    max: 0
