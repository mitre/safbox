---
# SAF CLI threshold for every validation run (ADR-0001: "Validation is the
# gate"), applied by scripts/validate.sh to the build's scan and to the
# release gate's scan of a clone.
#   saf validate threshold -i results.json -T verify/threshold.yml
#
# Phase 2 starts permissive: no critical or high control may fail; medium
# and low findings are reported but do not fail the build. Phase 7 tightens
# this once the STIG overlay lands.
#
# passed.total.min is a floor on how many controls must actually pass, so a
# run in which controls are silently skipped (an only_if gone wrong, a wrong
# input) fails instead of passing on what little ran. It is what a build
# with the repository defaults passes: controls for the build record and the
# finished first boot only apply to a clone, and the smoke-test Quadlet
# control only to builds that opt in (safbox_example_quadlet_enabled). Raise
# it when controls are added. The four tools controls (safbox-tools-1..4,
# one per tools group) count because every tools group is on by default and
# the expected_tools input lists all four. A build that switches a tools
# group off drops its tool from expected_tools, so that control skips, and
# must lower this floor by one to match (19 with Packer off).
passed:
  total:
    min: 20
failed:
  critical:
    max: 0
  high:
    max: 0
error:
  total:
    max: 0
